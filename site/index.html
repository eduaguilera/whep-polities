<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WHEP Polities Database</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; }

#map, #graph, #data-map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
#graph, #data-map { display: none; background: #0a0a14; }
#graph svg { width: 100%; height: 100%; display: block; cursor: grab; }
#graph svg:active { cursor: grabbing; }
body.graph-mode #map, body.graph-mode #data-map { display: none; }
body.graph-mode #graph { display: block; }
body.data-mode #map, body.data-mode #graph { display: none; }
body.data-mode #data-map { display: block; }
body:not(.graph-mode):not(.data-mode) #map { display: block; }
body:not(.graph-mode):not(.data-mode) #graph { display: none; }
body:not(.graph-mode):not(.data-mode) #data-map { display: none; }

.data-only { display: block; }
body:not(.data-mode) .data-only { display: none; }

#data-legend {
  position: absolute; right: 16px; bottom: 16px; z-index: 10;
  background: rgba(15,15,25,0.92); color: #ddd; padding: 10px 12px;
  border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
  font-size: 11px; max-width: 260px;
  backdrop-filter: blur(10px);
}
#data-legend .dl-title { font-weight: 600; color: #fff; margin-bottom: 4px; }
#data-legend .dl-sub { color: #999; font-size: 10px; margin-bottom: 6px; }
#data-legend .dl-gradient { height: 10px; border-radius: 3px; margin: 6px 0 4px; }
#data-legend .dl-row { display: flex; justify-content: space-between; color: #bbb; font-size: 10px; }

#data-unmatched {
  position: absolute; right: 16px; top: 16px; z-index: 10;
  background: rgba(15,15,25,0.92); color: #ddd; padding: 10px 12px;
  border-radius: 8px; border: 1px solid rgba(255,120,120,0.25);
  font-size: 11px; max-width: 280px; max-height: 50vh; overflow-y: auto;
  backdrop-filter: blur(10px); display: none;
}
#data-unmatched .du-title {
  font-weight: 600; color: #ff8080; margin-bottom: 3px;
  display: flex; justify-content: space-between; align-items: center;
}
#data-unmatched .du-sub { color: #999; font-size: 10px; margin-bottom: 6px; }
#data-unmatched .du-row {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 3px 0; border-top: 1px solid rgba(255,255,255,0.05);
  font-size: 11px;
}
#data-unmatched .du-row:first-of-type { border-top: none; }
#data-unmatched .du-name { color: #ccc; }
#data-unmatched .du-iso { color: #888; font-size: 10px; margin-left: 4px; }
#data-unmatched .du-val { color: #ffd166; white-space: nowrap; font-variant-numeric: tabular-nums; }

#data-no-polygon {
  position: absolute; right: 16px; z-index: 9;
  background: rgba(15,15,25,0.92); color: #ddd; padding: 10px 12px;
  border-radius: 8px; border: 1px solid rgba(255,180,60,0.25);
  font-size: 11px; max-width: 280px; max-height: 35vh; overflow-y: auto;
  backdrop-filter: blur(10px); display: none;
}
#data-no-polygon .np-title {
  font-weight: 600; color: #ffb844; margin-bottom: 3px;
  display: flex; justify-content: space-between; align-items: center;
}
#data-no-polygon .np-sub { color: #999; font-size: 10px; margin-bottom: 6px; }
#data-no-polygon .np-row {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 3px 0; border-top: 1px solid rgba(255,255,255,0.05);
  font-size: 11px;
}
#data-no-polygon .np-row:first-of-type { border-top: none; }
#data-no-polygon .np-code { color: #aaa; font-size: 10px; }
#data-no-polygon .np-val { color: #ffb844; white-space: nowrap; font-variant-numeric: tabular-nums; }

#tabs {
  display: flex; gap: 4px; margin-bottom: 10px;
  background: rgba(0,0,0,0.3); border-radius: 6px; padding: 3px;
}
.tab-btn {
  flex: 1; padding: 6px 10px; border-radius: 4px; font-size: 12px;
  background: transparent; color: #888; border: none; cursor: pointer;
  font-family: inherit; font-weight: 500;
}
.tab-btn.active { background: rgba(100,158,255,0.18); color: #5a9eff; }
.tab-btn:hover:not(.active) { color: #bbb; }

.graph-only, .map-only { display: block; }
body.graph-mode .map-only { display: none; }
body:not(.graph-mode) .graph-only { display: none; }

.ctrl-group { margin-bottom: 8px; }
.ctrl-group label { font-size: 11px; color: #888; display: block; margin-bottom: 3px; }
.ctrl-group select, .ctrl-group input[type="text"], .ctrl-group input[type="number"] {
  width: 100%; padding: 6px 10px; border-radius: 5px; font-size: 12px; outline: none;
  border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #fff;
  font-family: inherit;
}
.ctrl-group select:focus, .ctrl-group input:focus { border-color: rgba(100,180,255,0.4); }
.ctrl-group select option { background: #1a1a2a; color: #fff; }
#graph-focus-results {
  max-height: 180px; overflow-y: auto; margin-top: 4px;
  border: 1px solid rgba(255,255,255,0.08); border-radius: 5px;
  background: rgba(20,20,35,0.95); display: none;
}
#graph-focus-results.open { display: block; }
#graph-focus-results .result-item { padding: 6px 8px; font-size: 12px; cursor: pointer; }
#graph-focus-results .result-item:hover, #graph-focus-results .result-item.active { background: rgba(100,180,255,0.15); }
#graph-focus-results .result-item .code { color: #666; font-size: 10px; }

.graph-legend { font-size: 10px; color: #777; margin-top: 6px; line-height: 1.6; }
.graph-legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 4px; }

#graph-tooltip {
  position: absolute; pointer-events: none; z-index: 20;
  background: rgba(15,15,25,0.95); border: 1px solid rgba(255,255,255,0.15);
  padding: 6px 10px; border-radius: 5px; font-size: 11px; color: #ddd;
  display: none; max-width: 260px; line-height: 1.4;
}
#graph-tooltip .tt-name { color: #fff; font-weight: 600; margin-bottom: 2px; }
#graph-tooltip .tt-code { color: #888; font-size: 10px; }
#graph-tooltip .tt-warn { color: #f66; margin-top: 3px; }

/* Wiki reader modal */
#wiki-modal {
  position: fixed; inset: 0; z-index: 200; display: none;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
#wiki-modal.open { display: flex; }
#wiki-modal-inner {
  background: #111222; color: #ddd;
  width: min(860px, calc(100vw - 40px));
  height: min(80vh, calc(100vh - 60px));
  border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
#wiki-modal-header {
  padding: 10px 16px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02);
}
#wiki-modal-back, #wiki-modal-close {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  color: #ccc; border-radius: 5px; padding: 4px 9px; font-size: 12px;
  font-family: inherit; cursor: pointer;
}
#wiki-modal-back:hover, #wiki-modal-close:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
#wiki-modal-back[disabled] { opacity: 0.35; cursor: default; }
#wiki-modal-title { flex: 1; font-size: 13px; color: #999; font-family: ui-monospace, SFMono-Regular, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#wiki-modal-body {
  padding: 18px 24px; overflow-y: auto; flex: 1;
  font-size: 14px; line-height: 1.6; color: #d8d8d8;
}
#wiki-modal-body h1 { font-size: 22px; color: #fff; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
#wiki-modal-body h2 { font-size: 16px; color: #fff; margin: 18px 0 8px; }
#wiki-modal-body h3 { font-size: 14px; color: #ddd; margin: 14px 0 6px; }
#wiki-modal-body p { margin-bottom: 10px; }
#wiki-modal-body ul, #wiki-modal-body ol { margin: 0 0 10px 22px; }
#wiki-modal-body li { margin-bottom: 4px; }
#wiki-modal-body code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, monospace; color: #ffd166; }
#wiki-modal-body a { color: #5a9eff; text-decoration: none; }
#wiki-modal-body a:hover { text-decoration: underline; }
#wiki-modal-body blockquote { border-left: 3px solid rgba(100,180,255,0.3); padding: 2px 12px; color: #bbb; margin: 8px 0; }
#wiki-modal-body hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 16px 0; }
#wiki-modal-body .wiki-frontmatter {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px; padding: 10px 14px; margin-bottom: 16px;
  font-size: 11px; color: #aaa; font-family: ui-monospace, SFMono-Regular, monospace;
}
#wiki-modal-body .wiki-frontmatter b { color: #ddd; }
#wiki-modal-body .wiki-error { color: #f66; padding: 30px 0; text-align: center; }

#info .read-wiki-btn {
  display: inline-block; margin-top: 8px; padding: 5px 10px;
  background: rgba(100,180,255,0.12); border: 1px solid rgba(100,180,255,0.35);
  color: #5a9eff; border-radius: 5px; font-size: 11px; cursor: pointer;
  font-family: inherit;
}
#info .read-wiki-btn:hover { background: rgba(100,180,255,0.22); }

#panel {
  position: absolute; top: 10px; left: 10px; z-index: 10;
  background: rgba(15,15,25,0.92); border-radius: 10px; padding: 16px;
  width: 340px; max-height: calc(100vh - 20px); overflow-y: auto;
  backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#panel-header { display: flex; align-items: center; justify-content: space-between; }
#panel h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #fff; }
#panel .subtitle { font-size: 11px; color: #888; margin-bottom: 12px; }
#panel-minimize {
  background: none; border: 1px solid rgba(255,255,255,0.15); color: #888;
  width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
#panel-minimize:hover { border-color: rgba(255,255,255,0.3); color: #ccc; }
#panel.minimized .panel-body { display: none; }
#panel.minimized { }
@media (max-width: 600px) {
  #panel { width: calc(100% - 20px); }
}

#search {
  width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06); color: #fff; font-size: 13px; outline: none;
  margin-bottom: 8px;
}
#search:focus { border-color: rgba(100,180,255,0.4); }
#search::placeholder { color: #666; }

.filter-toggle {
  width: 100%; padding: 7px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
  color: #aaa; text-align: left; margin-bottom: 2px; display: flex; justify-content: space-between;
}
.filter-toggle:hover { border-color: rgba(255,255,255,0.25); }
.filter-dropdown {
  margin-bottom: 8px; padding: 0;
  border: 1px solid rgba(255,255,255,0.08); border-top: none;
  border-radius: 0 0 6px 6px; background: rgba(20,20,35,0.95);
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
}
.filter-dropdown.open { max-height: 400px; opacity: 1; padding: 6px 0; }
.filter-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer;
  font-size: 12px; color: #999; transition: background 0.1s;
}
.filter-row:hover { background: rgba(255,255,255,0.04); }
.filter-row input[type="checkbox"] { display: none; }
.filter-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid currentColor; transition: all 0.1s;
}
.filter-row.active .filter-dot { background: currentColor; }
.filter-row.active { color: #ddd; }
.filter-count { margin-left: auto; font-size: 10px; color: #555; }

#year-display {
  font-size: 28px; font-weight: 700; color: #fff; text-align: center; margin: 8px 0 2px;
  background: transparent; border: none; width: 100%; outline: none; font-family: inherit;
  border-bottom: 2px solid transparent; transition: border-color 0.15s;
}
#year-display:focus { border-bottom-color: #5a9eff; }
#year-range { width: 100%; margin-bottom: 4px; accent-color: #5a9eff; }
.slider-labels { display: flex; justify-content: space-between; font-size: 10px; color: #555; margin-bottom: 10px; }

#stats { font-size: 11px; color: #777; margin-bottom: 10px; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 6px; }

#info {
  display: none; margin-top: 10px; padding: 12px; border-radius: 8px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
}
#info h2 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 6px; }
#info .meta { font-size: 12px; line-height: 1.7; color: #bbb; }
#info .meta span { color: #5a9eff; }
#info .chain { margin-top: 8px; font-size: 11px; }
#info .chain a { color: #5a9eff; cursor: pointer; text-decoration: none; }
#info .chain a:hover { text-decoration: underline; }

#results { max-height: 200px; overflow-y: auto; margin-top: 6px; }
.result-item {
  padding: 6px 8px; font-size: 12px; cursor: pointer; border-radius: 4px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.result-item:hover { background: rgba(100,180,255,0.1); }
.result-item .code { color: #666; font-size: 10px; }

.type-badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px;
}

#loading {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 100; color: #888; font-size: 14px;
}
</style>
</head>
<body>

<div id="loading">Loading polities data...</div>
<div id="map"></div>
<div id="data-map"></div>
<div id="data-legend" style="display:none"></div>
<div id="data-unmatched"></div>
<div id="data-no-polygon"></div>
<div id="graph"><svg></svg></div>
<div id="graph-tooltip"></div>

<div id="wiki-modal">
  <div id="wiki-modal-inner">
    <div id="wiki-modal-header">
      <button id="wiki-modal-back" disabled title="Back">&#x2190;</button>
      <div id="wiki-modal-title"></div>
      <button id="wiki-modal-close" title="Close (Esc)">&#x2715;</button>
    </div>
    <div id="wiki-modal-body"></div>
  </div>
</div>

<div id="panel">
  <div id="panel-header">
    <h1>WHEP Polities Database</h1>
    <button id="panel-minimize" title="Minimize panel">&#x2212;</button>
  </div>
  <div class="subtitle">Wiki-sourced political entities, 1800-2025</div>

  <div id="tabs">
    <button class="tab-btn active" data-view="map">Map</button>
    <button class="tab-btn" data-view="graph">Graph</button>
    <button class="tab-btn" data-view="data">Data</button>
  </div>

  <input type="text" id="year-display" value="1900" inputmode="numeric" />
  <input type="range" id="year-range" min="1800" max="2025" value="1900" step="1" />
  <div class="slider-labels"><span>1800</span><span>1900</span><span>2025</span></div>

  <div class="panel-body">
    <input type="text" id="search" placeholder="Search polities..." />

    <div class="map-only">
      <button class="filter-toggle" id="filter-toggle">Filter types <span id="filter-summary"></span></button>
      <div class="filter-dropdown" id="type-filters"></div>
    </div>

    <div class="data-only">
      <div class="ctrl-group">
        <label>Dataset</label>
        <select id="data-dataset"></select>
      </div>
      <div class="ctrl-group">
        <label id="data-metric-label">Measure</label>
        <select id="data-metric"></select>
      </div>
      <div class="ctrl-group">
        <label>Item</label>
        <select id="data-item"></select>
      </div>
      <div id="data-info" style="font-size:11px;color:#999;margin-bottom:8px"></div>
    </div>

    <div class="graph-only">
      <div class="ctrl-group">
        <label>Scope</label>
        <select id="graph-scope">
          <option value="continent">Entire continent</option>
          <option value="focus">Focus polity (k-hop neighborhood)</option>
          <option value="all">All polities (heavy)</option>
          <option value="orphans">Orphans &amp; broken refs only</option>
        </select>
      </div>
      <div class="ctrl-group" id="graph-focus-group">
        <label>Focus polity (type to search, click a match)</label>
        <input type="text" id="graph-focus" autocomplete="off" placeholder="search name or code..." />
        <div id="graph-focus-results"></div>
      </div>
      <div class="ctrl-group" id="graph-hops-group">
        <label>Hops: <span id="graph-hops-val">5</span></label>
        <input type="range" id="graph-hops" min="1" max="5" value="5" step="1" style="width:100%" />
      </div>
      <div class="ctrl-group" id="graph-continent-group" style="display:none">
        <label>Continent</label>
        <select id="graph-continent"></select>
      </div>
      <div class="ctrl-group">
        <label>Color by</label>
        <select id="graph-color">
          <option value="type">Polity type</option>
          <option value="continent">Continent</option>
          <option value="wiki_status">Wiki status</option>
          <option value="polygon">Has polygon</option>
        </select>
      </div>
      <div class="graph-legend" id="graph-legend"></div>
    </div>

    <div id="stats"></div>

    <div id="results"></div>

    <div id="info">
      <h2 id="info-name"></h2>
      <div class="meta" id="info-meta"></div>
      <div class="chain" id="info-chain"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const TYPE_COLORS = {
  national: '#2196F3', subnational: '#4CAF50', aggregate: '#607D8B'
};

// Diverse palette for political-map style coloring
const MAP_PALETTE = [
  '#e6194b', '#3cb44b', '#4363d8', '#f58231', '#42d4f4',
  '#f032e6', '#fabed4', '#469990', '#dcbeff', '#9A6324',
  '#ffe119', '#aaffc3', '#808000', '#ffd8b1', '#000075',
  '#a9a9a9', '#e6beff', '#800000', '#fffac8', '#bfef45',
  '#911eb4', '#46f0f0', '#f032e6', '#bcf60c', '#fabebe',
  '#008080', '#e6194b', '#aa6e28', '#808080', '#0082c8'
];

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

function polityColor(code) {
  return MAP_PALETTE[hashCode(code) % MAP_PALETTE.length];
}

let polities = [];
let geoData = null;
const HIDDEN_BY_DEFAULT = new Set(['subnational', 'aggregate']);
let activeTypes = new Set(Object.keys(TYPE_COLORS).filter(t => !HIDDEN_BY_DEFAULT.has(t)));
let selectedYear = 1900;
let selectedCode = null;
let map;

// CSV parser
function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}

async function loadCSV() {
  const res = await fetch('polities.csv?v=' + Date.now());
  const text = await res.text();
  const lines = text.trim().split('\n');
  const headers = parseCSVLine(lines[0]);
  polities = lines.slice(1).map(line => {
    const vals = parseCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] || '');
    obj.start_year = parseInt(obj.start_year) || 1800;
    obj.end_year = parseInt(obj.end_year) || 2025;
    return obj;
  });
}

async function loadGeoJSON() {
  const res = await fetch('polities.geojson?v=' + Date.now());
  geoData = await res.json();
  // Index features by polity_code for fast lookup
  geoData._index = {};
  geoData.features.forEach(f => {
    if (f.properties && f.properties.polity_code) {
      geoData._index[f.properties.polity_code] = f;
    }
  });
}

function updateFilterSummary() {
  const total = Object.keys(TYPE_COLORS).length;
  const on = activeTypes.size;
  document.getElementById('filter-summary').textContent = `${on}/${total}`;
}

function buildTypeFilters() {
  const container = document.getElementById('type-filters');
  const typeCounts = {};
  polities.forEach(p => { typeCounts[p.polity_type] = (typeCounts[p.polity_type] || 0) + 1; });
  const types = Object.keys(TYPE_COLORS).sort((a, b) => (typeCounts[b] || 0) - (typeCounts[a] || 0));

  types.forEach(type => {
    const row = document.createElement('div');
    row.className = 'filter-row' + (activeTypes.has(type) ? ' active' : '');
    const color = TYPE_COLORS[type] || '#888';
    row.style.color = activeTypes.has(type) ? color : '#666';
    row.innerHTML = `<span class="filter-dot" style="color:${color}"></span>${type}<span class="filter-count">${typeCounts[type] || 0}</span>`;
    row.onclick = () => {
      if (activeTypes.has(type)) { activeTypes.delete(type); row.classList.remove('active'); row.style.color = '#666'; }
      else { activeTypes.add(type); row.classList.add('active'); row.style.color = color; }
      updateFilterSummary();
      updateMap();
    };
    container.appendChild(row);
  });

  const toggleBtn = document.getElementById('filter-toggle');
  toggleBtn.onclick = () => container.classList.toggle('open');
  document.addEventListener('click', (e) => {
    if (!container.contains(e.target) && e.target !== toggleBtn && !toggleBtn.contains(e.target)) {
      container.classList.remove('open');
    }
  });
  updateFilterSummary();
}

function getActivePolities() {
  return polities.filter(p =>
    p.start_year <= selectedYear &&
    p.end_year >= selectedYear &&
    activeTypes.has(p.polity_type)
  );
}

function updateStats() {
  const active = getActivePolities();
  document.getElementById('stats').innerHTML =
    `<b>${active.length}</b> active polities in <b>${selectedYear}</b> &middot; ${polities.length} total in database`;
}

function buildFilteredGeoJSON() {
  const activeCodes = new Set(getActivePolities().map(p => p.polity_code));
  return {
    type: 'FeatureCollection',
    features: geoData.features
      .filter(f => f.properties && activeCodes.has(f.properties.polity_code))
      .map(f => ({
        ...f,
        properties: { ...f.properties, _color: polityColor(f.properties.polity_code) }
      }))
  };
}

function updateMap() {
  if (!map || !geoData) return;
  const filtered = buildFilteredGeoJSON();
  map.getSource('polities').setData(filtered);
  updateHighlight();
  updateStats();
}

function updateHighlight() {
  if (!map || !geoData || !map.getSource('highlight')) return;
  if (!selectedCode) {
    map.getSource('highlight').setData({ type: 'FeatureCollection', features: [] });
    return;
  }
  const feat = geoData._index[selectedCode];
  if (feat) {
    map.getSource('highlight').setData({ type: 'FeatureCollection', features: [feat] });
  } else {
    map.getSource('highlight').setData({ type: 'FeatureCollection', features: [] });
  }
}

function showInfo(code) {
  const p = polities.find(x => x.polity_code === code);
  if (!p) return;

  // Jump year if the current year is outside the polity's range
  if (selectedYear < p.start_year || selectedYear > p.end_year) {
    // Pick the midpoint, clamped to the polity's range
    const target = Math.min(p.end_year, Math.max(p.start_year, selectedYear));
    setYear(target === selectedYear ? p.start_year : target);
  }

  // Ensure the polity type is visible (only relevant in map tab)
  if (currentView === 'map' && !activeTypes.has(p.polity_type)) {
    activeTypes.add(p.polity_type);
    const color = TYPE_COLORS[p.polity_type] || '#888';
    document.querySelectorAll('.filter-row').forEach(row => {
      if (row.textContent.includes(p.polity_type)) {
        row.classList.add('active');
        row.style.color = color;
      }
    });
    updateFilterSummary();
    updateMap();
  }

  // Highlight this polity on the map (polities map or data map)
  selectedCode = code;
  updateHighlight();

  // Zoom to the polity's bounds on the active map
  const feat = geoData && geoData._index[code];
  if (feat && feat.geometry) {
    const bounds = new maplibregl.LngLatBounds();
    const addCoords = (coords) => {
      if (typeof coords[0] === 'number') { bounds.extend(coords); return; }
      coords.forEach(addCoords);
    };
    addCoords(feat.geometry.coordinates);
    if (!bounds.isEmpty()) {
      const targetMap = currentView === 'data' ? dataMap : map;
      if (targetMap) {
        targetMap.fitBounds(bounds, { padding: 80, maxZoom: 6, duration: 600 });
      }
    }
  }

  // Keep graph focus input synced so switching to graph view centers on this polity
  const focusInput = document.getElementById('graph-focus');
  if (focusInput) focusInput.value = code;
  // If we're in the graph tab with focus scope, reset hops to max and rerender.
  if (currentView === 'graph' && document.getElementById('graph-scope').value === 'focus') {
    const hopsSlider = document.getElementById('graph-hops');
    if (hopsSlider) {
      hopsSlider.value = hopsSlider.max;
      document.getElementById('graph-hops-val').textContent = hopsSlider.max;
    }
    renderGraph();
  }

  document.getElementById('info').style.display = 'block';
  document.getElementById('info-name').textContent = p.polity_name;

  const color = polityColor(p.polity_code);
  let html = `
    <span class="type-badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${p.polity_type}</span>
    ${p.wiki_status ? `<span class="type-badge" style="background:${p.wiki_status === 'reviewed' ? '#4CAF5022' : '#FF980022'};color:${p.wiki_status === 'reviewed' ? '#4CAF50' : '#FF9800'};border:1px solid ${p.wiki_status === 'reviewed' ? '#4CAF5044' : '#FF980044'};margin-left:4px">${p.wiki_status}</span>` : ''}<br>
    <b>Code:</b> <span>${p.polity_code}</span><br>
    <b>Period:</b> <span>${p.start_year} - ${p.end_year}</span> (${p.end_year - p.start_year + 1} years)<br>
    <b>Continent:</b> ${p.continent}<br>
  `;
  if (p.iso3_code && p.iso3_code !== 'NA') html += `<b>ISO3:</b> <span>${p.iso3_code}</span><br>`;
  if (p.polygon_source && p.polygon_source !== 'NA') html += `<b>Polygon:</b> ${p.polygon_source}<br>`;
  if (p.notes && p.notes !== 'NA') html += `<b>Notes:</b> <span style="color:#999">${p.notes.substring(0, 300)}${p.notes.length > 300 ? '...' : ''}</span><br>`;
  html += `<button class="read-wiki-btn" onclick="openWikiModal('${p.polity_code}')">Read wiki page &rarr;</button>`;
  document.getElementById('info-meta').innerHTML = html;

  let chain = '';
  if (p.predecessor && p.predecessor !== 'NA') {
    const preds = p.predecessor.split(';').map(s => s.trim());
    chain += 'Predecessor: ' + preds.map(c => `<a onclick="showInfo('${c}')">${c}</a>`).join(', ') + '<br>';
  }
  if (p.successor && p.successor !== 'NA') {
    const succs = p.successor.split(';').map(s => s.trim());
    chain += 'Successor: ' + succs.map(c => `<a onclick="showInfo('${c}')">${c}</a>`).join(', ');
  }
  document.getElementById('info-chain').innerHTML = chain;
}

// Search
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  const resultsEl = document.getElementById('results');
  if (q.length < 2) { resultsEl.innerHTML = ''; return; }
  const matches = polities.filter(p =>

  ).slice(0, 20);
  resultsEl.innerHTML = matches.map(p => `
    <div class="result-item" onclick="showInfo('${p.polity_code}')">
      ${p.polity_name} <span class="code">${p.polity_code} (${p.start_year}-${p.end_year})</span>
    </div>
  `).join('');
});

// Panel minimize toggle
function togglePanel(forceMinimize) {
  const panel = document.getElementById('panel');
  const btn = document.getElementById('panel-minimize');
  if (forceMinimize === true) panel.classList.add('minimized');
  else if (forceMinimize === false) panel.classList.remove('minimized');
  else panel.classList.toggle('minimized');
  if (panel.classList.contains('minimized')) {
    document.getElementById('search').value = '';
    document.getElementById('results').innerHTML = '';
  }
  const min = panel.classList.contains('minimized');
  btn.innerHTML = min ? '&#x002B;' : '&#x2212;';
  btn.title = min ? 'Expand panel' : 'Minimize panel';
}
document.getElementById('panel-minimize').addEventListener('click', () => togglePanel());

// Year slider + text input
const slider = document.getElementById('year-range');
const yearInput = document.getElementById('year-display');

function setYear(y) {
  const lo = parseInt(slider.min) || 1800;
  const hi = parseInt(slider.max) || 2025;
  y = Math.max(lo, Math.min(hi, y));
  selectedYear = y;
  slider.value = y;
  yearInput.value = y;
  updateMap();
  if (currentView === 'data') {
    dataYear = y;
    renderDataMap();
  }
  if (currentView === 'graph') {
    d3.selectAll('.graph-node').attr('opacity', d => {
      if (!d || !d.data) return 1;
      return (d.data.start_year <= selectedYear && d.data.end_year >= selectedYear) ? 1 : 0.35;
    });
  }
}

slider.addEventListener('input', () => setYear(parseInt(slider.value)));

yearInput.addEventListener('change', () => {
  const v = parseInt(yearInput.value);
  if (!isNaN(v)) setYear(v);
  else yearInput.value = selectedYear;
});
yearInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { yearInput.blur(); }
});

// ----- Wiki reader modal -----
const wikiHistory = [];
let wikiCurrent = null;

async function loadWikiPath(relPath, pushHistory = true) {
  const modal = document.getElementById('wiki-modal');
  const body = document.getElementById('wiki-modal-body');
  const title = document.getElementById('wiki-modal-title');
  modal.classList.add('open');
  body.scrollTop = 0;
  body.innerHTML = '<div style="color:#888;padding:20px">Loading…</div>';
  title.textContent = relPath;

  // Update history *before* the fetch so Back works even on a 404.
  if (pushHistory && wikiCurrent && wikiCurrent !== relPath) {
    wikiHistory.push(wikiCurrent);
  }
  wikiCurrent = relPath;
  document.getElementById('wiki-modal-back').disabled = wikiHistory.length === 0;

  try {
    const res = await fetch(relPath + '?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    renderWikiMarkdown(text, relPath);
  } catch (err) {
    body.innerHTML = `<div class="wiki-error">Could not load <code>${relPath}</code><br><span style="color:#888;font-size:12px">${err.message}</span></div>`;
  }
}

function renderWikiMarkdown(text, relPath) {
  // Split out YAML frontmatter so we can render it as a styled block.
  let frontmatter = null;
  let md = text;
  if (text.startsWith('---\n')) {
    const end = text.indexOf('\n---', 4);
    if (end !== -1) {
      frontmatter = text.slice(4, end).trim();
      md = text.slice(end + 4).replace(/^\s*\n/, '');
    }
  }
  const fmHtml = frontmatter
    ? `<div class="wiki-frontmatter">${
        frontmatter.split('\n').map(line => {
          const [k, ...rest] = line.split(':');
          return `<div><b>${k.trim()}</b>: ${rest.join(':').trim()}</div>`;
        }).join('')
      }</div>` : '';

  const baseDir = relPath.substring(0, relPath.lastIndexOf('/') + 1);
  const rendered = marked.parse(md);
  document.getElementById('wiki-modal-body').innerHTML = fmHtml + rendered;

  // Rewrite internal links to fetch via the modal instead of navigating away.
  document.querySelectorAll('#wiki-modal-body a').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (href.startsWith('http') || href.startsWith('#')) return; // external or in-page anchor
    a.addEventListener('click', (ev) => {
      ev.preventDefault();
      // Resolve relative path against the current page's directory.
      const [pathPart, hash] = href.split('#');
      let target = pathPart ? new URL(pathPart, location.origin + '/' + baseDir).pathname.replace(/^\/+/, '') : relPath;
      loadWikiPath(target);
    });
  });
  document.getElementById('wiki-modal-title').textContent = relPath;
}

function openWikiModal(code) {
  wikiHistory.length = 0;
  wikiCurrent = null;
  loadWikiPath('wiki/polities/' + code.toLowerCase() + '.md');
}
window.openWikiModal = openWikiModal;

function closeWikiModal() {
  document.getElementById('wiki-modal').classList.remove('open');
  wikiHistory.length = 0;
  wikiCurrent = null;
}

document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('wiki-modal');
  if (!modal) return;
  document.getElementById('wiki-modal-close').addEventListener('click', closeWikiModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeWikiModal(); });
  document.getElementById('wiki-modal-back').addEventListener('click', () => {
    if (wikiHistory.length) {
      const prev = wikiHistory.pop();
      loadWikiPath(prev, false);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeWikiModal();
  });
});

// ----- Data view -----
let dataMap = null;
let dataCatalog = null;
let dataDatasetIndexCache = {}; // dataset id -> index json
let dataItemCache = {};         // dataset/metric/slug -> loaded item json
let dataActiveDataset = null;   // catalog dataset currently shown
let dataActiveMetric = null;    // metric/element currently shown
let dataActiveItem = null;  // loaded item json currently shown
let dataYear = null;        // year being displayed

// Viridis-ish color ramp (6 stops).
const DATA_PALETTE = ['#440154', '#3b528b', '#21918c', '#5ec962', '#fde725'];

const FALLBACK_DATA_CATALOG = {
  datasets: [{
    id: 'pre1961',
    label: 'Pre-1961 production test data',
    description: 'Historical production test dataset already bundled with the site.',
    index: 'pre1961/by_item_index.json',
    itemPath: 'pre1961/by_item/{slug}.json',
    metricLabel: 'Measure'
  }]
};

async function initDataCatalog() {
  if (dataCatalog) return dataCatalog;
  try {
    const res = await fetch('data/catalog.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    dataCatalog = await res.json();
  } catch (err) {
    dataCatalog = FALLBACK_DATA_CATALOG;
  }
  const sel = document.getElementById('data-dataset');
  if (sel) {
    sel.innerHTML = dataCatalog.datasets.map(ds =>
      `<option value="${ds.id}">${ds.label}</option>`
    ).join('');
  }
  return dataCatalog;
}

async function loadDatasetIndex(dataset) {
  if (dataDatasetIndexCache[dataset.id]) return dataDatasetIndexCache[dataset.id];
  const res = await fetch(dataset.index + '?v=' + Date.now());
  if (!res.ok) throw new Error(`Could not load ${dataset.index}`);
  const json = await res.json();
  dataDatasetIndexCache[dataset.id] = json;
  return json;
}

function metricsForDatasetIndex(index) {
  if (Array.isArray(index.metrics) && index.metrics.length) {
    return index.metrics;
  }
  return [{
    id: 'value',
    label: 'value',
    items: index.items || []
  }];
}

function itemPathFor(dataset, metric, item) {
  if (item.path) return item.path;
  return (dataset.itemPath || '')
    .replace('{metric}', metric.id)
    .replace('{slug}', item.slug);
}

function itemOptionLabel(item) {
  const polities = item.polities || item.polity_count || '';
  const polityText = polities ? `, ${polities} polities` : '';
  return `${item.item} (${item.year_min}–${item.year_max}${polityText})`;
}

async function onDataDatasetChange(datasetId) {
  const catalog = await initDataCatalog();
  const dataset = catalog.datasets.find(ds => ds.id === datasetId) || catalog.datasets[0];
  dataActiveDataset = dataset;
  dataActiveItem = null;

  const index = await loadDatasetIndex(dataset);
  const metrics = metricsForDatasetIndex(index);
  const metricSel = document.getElementById('data-metric');
  const metricLabel = document.getElementById('data-metric-label');
  if (metricLabel) metricLabel.textContent = dataset.metricLabel || 'Measure';
  if (metricSel) {
    metricSel.innerHTML = metrics.map(metric =>
      `<option value="${metric.id}">${metric.label}</option>`
    ).join('');
  }
  await onDataMetricChange(metrics[0] ? metrics[0].id : null);
}

async function onDataMetricChange(metricId) {
  if (!dataActiveDataset) return;
  const index = await loadDatasetIndex(dataActiveDataset);
  const metrics = metricsForDatasetIndex(index);
  dataActiveMetric = metrics.find(metric => metric.id === metricId) || metrics[0] || null;
  const itemSel = document.getElementById('data-item');
  if (!dataActiveMetric || !itemSel) return;
  itemSel.innerHTML = (dataActiveMetric.items || []).map(item =>
    `<option value="${item.slug}">${itemOptionLabel(item)}</option>`
  ).join('');
  await onDataItemChange(itemSel.value);
}

async function loadDataItem(slug) {
  if (!dataActiveDataset || !dataActiveMetric || !slug) return null;
  const index = await loadDatasetIndex(dataActiveDataset);
  const metrics = metricsForDatasetIndex(index);
  const metric = metrics.find(m => m.id === dataActiveMetric.id) || dataActiveMetric;
  const item = (metric.items || []).find(it => it.slug === slug);
  if (!item) return null;
  const key = `${dataActiveDataset.id}/${metric.id}/${slug}`;
  if (dataItemCache[key]) return dataItemCache[key];
  const res = await fetch(itemPathFor(dataActiveDataset, metric, item) + '?v=' + Date.now());
  if (!res.ok) throw new Error(`Could not load ${slug}`);
  const json = await res.json();
  dataItemCache[key] = json;
  return json;
}

function dataColorFor(value, minLog, maxLog) {
  if (value === null || value === undefined || isNaN(value) || value <= 0) return '#333';
  const t = Math.max(0, Math.min(1, (Math.log10(value) - minLog) / (maxLog - minLog || 1)));
  // Piecewise-linear interpolate along DATA_PALETTE.
  const pos = t * (DATA_PALETTE.length - 1);
  const i = Math.min(Math.floor(pos), DATA_PALETTE.length - 2);
  const f = pos - i;
  const mix = (a, b) => {
    const ah = a.match(/\w\w/g).map(h => parseInt(h, 16));
    const bh = b.match(/\w\w/g).map(h => parseInt(h, 16));
    const r = ah.map((v, k) => Math.round(v + (bh[k] - v) * f));
    return '#' + r.map(v => v.toString(16).padStart(2, '0')).join('');
  };
  return mix(DATA_PALETTE[i].slice(1), DATA_PALETTE[i + 1].slice(1));
}

function buildDataGeoJSON(item, year) {
  const yearKey = String(year);
  const yearData = (item.by_year || {})[yearKey] || {};
  // Values can be plain numbers (legacy) or {v, c, i} objects (new format).
  const vals = Object.values(yearData).map(e => typeof e === 'object' ? e.v : e).filter(v => v > 0);
  if (!vals.length) return { geo: { type: 'FeatureCollection', features: [] }, minLog: 0, maxLog: 1 };
  const logs = vals.map(v => Math.log10(v));
  const minLog = Math.min(...logs);
  const maxLog = Math.max(...logs);
  const features = geoData.features
    .filter(f => yearData[f.properties.polity_code] !== undefined)
    .map(f => {
      const entry = yearData[f.properties.polity_code];
      const v = typeof entry === 'object' ? entry.v : entry;
      const inputCountry = typeof entry === 'object' ? (entry.c || '') : '';
      const inputIso = typeof entry === 'object' ? (entry.i || '') : '';
      return {
        ...f,
        properties: {
          ...f.properties,
          _data_value: v,
          _data_color: dataColorFor(v, minLog, maxLog),
          _input_country: inputCountry,
          _input_iso: inputIso
        }
      };
    });
  return { geo: { type: 'FeatureCollection', features }, minLog, maxLog };
}

function updateDataLegend(item, year, minLog, maxLog, featuresCount) {
  const el = document.getElementById('data-legend');
  if (!item) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  const grad = `linear-gradient(to right, ${DATA_PALETTE.join(', ')})`;
  const fmt = v => {
    const digits = v >= 100 ? 0 : v >= 10 ? 1 : 2;
    return new Intl.NumberFormat('en-US', {
      notation: v >= 1e6 ? 'compact' : 'standard',
      maximumFractionDigits: digits
    }).format(v);
  };
  const datasetLabel = item.dataset_label || (dataActiveDataset && dataActiveDataset.label) || '';
  const metricLabel = item.metric_label || (dataActiveMetric && dataActiveMetric.label) || '';
  const metricText = metricLabel && metricLabel !== 'value' ? ` &middot; ${metricLabel}` : '';
  const unitText = item.unit && item.unit !== metricLabel ? ` &middot; ${item.unit}` : '';
  el.innerHTML =
    `<div class="dl-title">${item.item}</div>
     <div class="dl-sub">${datasetLabel}${metricText} &middot; ${year} &middot; ${featuresCount} polities${unitText}</div>
     <div class="dl-gradient" style="background:${grad}"></div>
     <div class="dl-row"><span>${fmt(Math.pow(10, minLog))}</span><span>${fmt(Math.pow(10, maxLog))}</span></div>`;
  document.getElementById('data-info').textContent =
    `${featuresCount} polities with ${item.item.toLowerCase()} data for ${year}${item.positive_values_only ? ' · positive values only' : ''}`;
}

function renderDataMap() {
  if (!dataMap || !dataActiveItem || dataYear === null) return;
  const src = dataMap.getSource && dataMap.getSource('data-polities');
  if (!src) return; // Map not finished loading; its 'load' handler will call us.
  const { geo, minLog, maxLog } = buildDataGeoJSON(dataActiveItem, dataYear);
  src.setData(geo);
  updateDataLegend(dataActiveItem, dataYear, minLog, maxLog, geo.features.length);
  updateUnmatchedPanel(dataActiveItem, dataYear);
  updateNoPolygonPanel(dataActiveItem, dataYear);
}

function updateUnmatchedPanel(item, year) {
  const el = document.getElementById('data-unmatched');
  if (!el) return;
  const list = ((item.unmatched_by_year || {})[String(year)]) || [];
  if (!list.length) { el.style.display = 'none'; return; }
  const sorted = list.slice().sort((a, b) => (b.value || 0) - (a.value || 0));
  const fmt = v => (v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' :
                    v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' :
                    Number(v).toFixed(0));
  const total = sorted.reduce((s, r) => s + (r.value || 0), 0);
  el.innerHTML =
    `<div class="du-title"><span>Unmatched (${list.length})</span><span style="color:#999;font-weight:400;font-size:10px">${fmt(total)} ${item.unit}</span></div>
     <div class="du-sub">${item.item} &middot; ${year} &middot; not placed on the map</div>` +
    sorted.map(r => {
      const name = r.name || r.country || (r.area_code ? `Area ${r.area_code}` : 'Unknown area');
      const rawCode = r.iso3c || r.area_code || '';
      const code = rawCode && !String(name).includes(String(rawCode)) ? rawCode : '';
      return `<div class="du-row"><span class="du-name">${name}<span class="du-iso">${code}</span></span><span class="du-val">${fmt(r.value)}</span></div>`;
    }).join('');
  el.style.display = 'block';
}

function updateNoPolygonPanel(item, year) {
  const el = document.getElementById('data-no-polygon');
  if (!el) return;
  const list = ((item.no_polygon_by_year || {})[String(year)]) || [];
  if (!list.length) { el.style.display = 'none'; return; }
  // Position below unmatched panel
  const um = document.getElementById('data-unmatched');
  const umBottom = um && um.style.display !== 'none' ? um.offsetTop + um.offsetHeight + 8 : 16;
  el.style.top = umBottom + 'px';
  const sorted = list.slice().sort((a, b) => (b.value || 0) - (a.value || 0));
  const fmt = v => (v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' :
                    v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' :
                    Number(v).toFixed(0));
  const total = sorted.reduce((s, r) => s + (r.value || 0), 0);
  el.innerHTML =
    `<div class="np-title"><span>No polygon (${list.length})</span><span style="color:#999;font-weight:400;font-size:10px">${fmt(total)} ${item.unit}</span></div>
     <div class="np-sub">${item.item} &middot; ${year} &middot; matched but missing map geometry</div>` +
    sorted.map(r =>
      `<div class="np-row"><span>${r.country}<span class="np-code"> → ${r.polity_code}</span></span><span class="np-val">${fmt(r.value)}</span></div>`
    ).join('');
  el.style.display = 'block';
}

function initDataMap() {
  if (dataMap) return;
  dataMap = new maplibregl.Map({
    container: 'data-map',
    style: {
      version: 8,
      sources: {
        carto: {
          type: 'raster',
          tiles: ['https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'],
          tileSize: 256,
          attribution: '&copy; CARTO, &copy; OSM contributors'
        }
      },
      layers: [{ id: 'carto', type: 'raster', source: 'carto' }]
    },
    center: [20, 30],
    zoom: 2,
    maxZoom: 8
  });
  dataMap.on('load', () => {
    dataMap.addSource('data-polities', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });
    dataMap.addLayer({
      id: 'data-fill',
      type: 'fill',
      source: 'data-polities',
      paint: { 'fill-color': ['coalesce', ['get', '_data_color'], '#333'], 'fill-opacity': 0.7 }
    });
    dataMap.addLayer({
      id: 'data-outline',
      type: 'line',
      source: 'data-polities',
      paint: { 'line-color': '#fff', 'line-width': 0.4, 'line-opacity': 0.5 }
    });
    dataMap.on('click', 'data-fill', (e) => {
      if (e.features && e.features.length > 0) {
        const props = e.features[0].properties;
        const val = props._data_value;
        const src = props._input_country || '';
        const iso = props._input_iso || '';
        const srcLine = src ? `<br><span style="opacity:0.7">Source: ${src}${iso ? ' [' + iso + ']' : ''}</span>` : '';
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<div style="color:#111;font-size:12px"><b>${props.polity_code}</b><br>${Number(val).toLocaleString()} ${dataActiveItem.unit}${srcLine}</div>`)
          .addTo(dataMap);
        showInfo(props.polity_code);
      }
    });
    dataMap.on('mouseenter', 'data-fill', () => { dataMap.getCanvas().style.cursor = 'pointer'; });
    dataMap.on('mouseleave', 'data-fill', () => { dataMap.getCanvas().style.cursor = ''; });
    renderDataMap();
  });
}

async function onDataItemChange(slug) {
  const item = await loadDataItem(slug);
  if (!item) {
    dataActiveItem = null;
    document.getElementById('data-info').textContent = 'No items available for this dataset/metric.';
    return;
  }
  dataActiveItem = item;
  // Constrain the global year slider to the item's coverage.
  slider.min = item.year_min;
  slider.max = item.year_max;
  if (selectedYear < item.year_min || selectedYear > item.year_max) {
    setYear(Math.round((item.year_min + item.year_max) / 2));
  } else {
    dataYear = selectedYear;
    renderDataMap();
  }
  dataYear = selectedYear;
  renderDataMap();
}

async function activateDataView() {
  await initDataCatalog();
  initDataMap();
  const datasetSel = document.getElementById('data-dataset');
  if (datasetSel && !dataActiveDataset) {
    await onDataDatasetChange(datasetSel.value);
  } else {
    const sel = document.getElementById('data-item');
    if (sel && !dataActiveItem) {
      await onDataItemChange(sel.value);
    }
  }
  // Small timeout so the container has layout before map sizes itself.
  requestAnimationFrame(() => dataMap && dataMap.resize());
}

// ----- Graph view -----
const CONTINENT_COLORS = {
  Africa: '#e6194b', Asia: '#f58231', Europe: '#4363d8',
  'North America': '#3cb44b', 'South America': '#42d4f4',
  Oceania: '#f032e6', Antarctica: '#a9a9a9'
};
const STATUS_COLORS = { reviewed: '#4CAF50', draft: '#FF9800', pending: '#FF9800', '': '#888', NA: '#888' };

let polityIndex = {};
let graphSim = null;
let graphZoom = null;
let currentView = 'map';

function buildPolityIndex() {
  polityIndex = {};
  polities.forEach(p => { polityIndex[p.polity_code] = p; });
}

function getNeighbors(code) {
  const p = polityIndex[code];
  if (!p) return [];
  const out = [];
  ['predecessor', 'successor'].forEach(field => {
    if (p[field] && p[field] !== 'NA') {
      p[field].split(';').map(s => s.trim()).filter(Boolean).forEach(c => out.push(c));
    }
  });
  return out;
}

function collectGraph(scope) {
  const nodes = new Map(); // code -> {data, missing}
  const edges = []; // {source, target, kind}
  const addNode = (code) => {
    if (nodes.has(code)) return nodes.get(code);
    const p = polityIndex[code];
    const n = { id: code, data: p || null, missing: !p };
    nodes.set(code, n);
    return n;
  };
  const addEdgesFor = (code) => {
    const p = polityIndex[code];
    if (!p) return;
    if (p.predecessor && p.predecessor !== 'NA') {
      p.predecessor.split(';').map(s => s.trim()).filter(Boolean).forEach(pre => {
        addNode(pre);
        const dup = edges.find(e => e.source === pre && e.target === code);
        if (!dup) edges.push({ source: pre, target: code, kind: 'succession' });
      });
    }
    if (p.successor && p.successor !== 'NA') {
      p.successor.split(';').map(s => s.trim()).filter(Boolean).forEach(suc => {
        addNode(suc);
        // avoid duplicating if the successor also names this as predecessor
        const dup = edges.find(e => e.source === code && e.target === suc);
        if (!dup) edges.push({ source: code, target: suc, kind: 'succession' });
      });
    }
  };

  if (scope.mode === 'focus') {
    const start = scope.focus;
    if (!start || !polityIndex[start]) return { nodes: [], edges: [], warning: start ? `Code "${start}" not in database` : 'Enter a polity code' };
    const visited = new Set();
    const queue = [[start, 0]];
    while (queue.length) {
      const [c, d] = queue.shift();
      if (visited.has(c)) continue;
      visited.add(c);
      if (d < scope.hops) {
        getNeighbors(c).forEach(n => { if (!visited.has(n)) queue.push([n, d + 1]); });
      }
    }
    // Add only the BFS-visited nodes (addEdgesFor would otherwise leak depth+1 nodes).
    visited.forEach(c => addNode(c));
    visited.forEach(c => addEdgesFor(c));
    // Keep only edges whose endpoints are both in the visited set.
    const trimmedEdges = edges.filter(e => visited.has(e.source) && visited.has(e.target));
    // Drop any extra nodes that addEdgesFor may have added beyond the visited set.
    const trimmedNodes = [...nodes.values()].filter(n => visited.has(n.id));
    return { nodes: trimmedNodes, edges: trimmedEdges };
  }

  if (scope.mode === 'continent') {
    const keep = polities.filter(p => p.continent === scope.continent);
    keep.forEach(p => addNode(p.polity_code));
    keep.forEach(p => addEdgesFor(p.polity_code));
    return { nodes: [...nodes.values()], edges };
  }

  if (scope.mode === 'all') {
    polities.forEach(p => addNode(p.polity_code));
    polities.forEach(p => addEdgesFor(p.polity_code));
    return { nodes: [...nodes.values()], edges };
  }

  if (scope.mode === 'orphans') {
    // Nodes that are either isolated (no pred & no succ and nothing references them)
    // or reference missing codes (broken refs).
    const referencedBy = {};
    polities.forEach(p => {
      getNeighbors(p.polity_code).forEach(n => {
        referencedBy[n] = referencedBy[n] || new Set();
        referencedBy[n].add(p.polity_code);
      });
    });
    polities.forEach(p => {
      const neigh = getNeighbors(p.polity_code);
      const incoming = referencedBy[p.polity_code] ? referencedBy[p.polity_code].size : 0;
      const hasBroken = neigh.some(n => !polityIndex[n]);
      const isolated = neigh.length === 0 && incoming === 0;
      if (isolated || hasBroken) {
        addNode(p.polity_code);
        if (hasBroken) addEdgesFor(p.polity_code);
      }
    });
    return { nodes: [...nodes.values()], edges };
  }
  return { nodes: [], edges: [] };
}

function nodeColor(node, colorBy) {
  if (node.missing) return '#ff3b3b';
  const p = node.data;
  if (colorBy === 'type') return TYPE_COLORS[p.polity_type] || '#888';
  if (colorBy === 'continent') return CONTINENT_COLORS[p.continent] || '#888';
  if (colorBy === 'wiki_status') return STATUS_COLORS[p.wiki_status] || '#888';
  if (colorBy === 'polygon') return (p.polygon_source && p.polygon_source !== 'NA') ? '#4CAF50' : '#FF9800';
  return '#888';
}

function renderLegend(colorBy, graphData) {
  const el = document.getElementById('graph-legend');
  const entries = [];
  if (colorBy === 'type') {
    Object.entries(TYPE_COLORS).forEach(([k, c]) => entries.push([k, c]));
  } else if (colorBy === 'continent') {
    Object.entries(CONTINENT_COLORS).forEach(([k, c]) => entries.push([k, c]));
  } else if (colorBy === 'wiki_status') {
    entries.push(['reviewed', '#4CAF50'], ['draft/pending', '#FF9800'], ['unknown', '#888']);
  } else {
    entries.push(['has polygon', '#4CAF50'], ['no polygon', '#FF9800']);
  }
  entries.push(['missing / broken ref', '#ff3b3b']);
  const noPoly = graphData.nodes.filter(n => n.data && !(geoData && geoData._index && geoData._index[n.id])).length;
  const counts = { nodes: graphData.nodes.length, edges: graphData.edges.length,
    missing: graphData.nodes.filter(n => n.missing).length, noPoly };
  el.innerHTML =
    `<div style="margin-bottom:4px;color:#999"><b>${counts.nodes}</b> nodes &middot; <b>${counts.edges}</b> edges${counts.missing ? ` &middot; <span style="color:#f66">${counts.missing} broken</span>` : ''}${counts.noPoly ? ` &middot; <span style="color:#ffd166">${counts.noPoly} no-polygon</span>` : ''}</div>` +
    entries.map(([k, c]) => `<span style="margin-right:8px;white-space:nowrap"><span class="swatch" style="background:${c}"></span>${k}</span>`).join('') +
    `<div style="margin-top:4px;color:#aaa"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px dashed #ffd166;vertical-align:middle;margin-right:4px"></span>dashed = no polygon yet</div>`;
}

function currentScope() {
  const mode = document.getElementById('graph-scope').value;
  return {
    mode,
    focus: document.getElementById('graph-focus').value.trim(),
    hops: parseInt(document.getElementById('graph-hops').value) || 2,
    continent: document.getElementById('graph-continent').value,
    colorBy: document.getElementById('graph-color').value
  };
}

function updateGraphControlsVisibility() {
  const mode = document.getElementById('graph-scope').value;
  document.getElementById('graph-focus-group').style.display = mode === 'focus' ? '' : 'none';
  document.getElementById('graph-hops-group').style.display = mode === 'focus' ? '' : 'none';
  document.getElementById('graph-continent-group').style.display = mode === 'continent' ? '' : 'none';
}

function renderGraph() {
  const scope = currentScope();
  const data = collectGraph(scope);
  const svgEl = document.querySelector('#graph svg');
  const svg = d3.select(svgEl);
  svg.selectAll('*').remove();
  if (graphSim) graphSim.stop();

  renderLegend(scope.colorBy, data);

  if (data.warning) {
    svg.append('text')
      .attr('x', '50%').attr('y', '50%').attr('text-anchor', 'middle')
      .attr('fill', '#888').attr('font-size', '14px')
      .text(data.warning);
    return;
  }
  if (!data.nodes.length) {
    svg.append('text')
      .attr('x', '50%').attr('y', '50%').attr('text-anchor', 'middle')
      .attr('fill', '#666').attr('font-size', '14px').text('No nodes to show');
    return;
  }

  const width = svgEl.clientWidth;
  const height = svgEl.clientHeight;

  // defs: arrowhead
  svg.append('defs').append('marker')
    .attr('id', 'arrow').attr('viewBox', '0 -5 10 10')
    .attr('refX', 14).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#666');

  const rootG = svg.append('g').attr('class', 'root');
  graphZoom = d3.zoom().scaleExtent([0.1, 6]).on('zoom', (ev) => rootG.attr('transform', ev.transform));
  svg.call(graphZoom);

  const nodes = data.nodes.map(n => ({ ...n }));
  const links = data.edges.map(e => ({ ...e }));

  const sizeFor = (n) => n.missing ? 4 : (selectedCode === n.id ? 9 : 6);
  // Label style scales with graph density.
  const dense = nodes.length > 300;
  const medium = nodes.length > 120;
  const labelFont = dense ? 8 : (medium ? 9 : 10);
  const labelMax = dense ? 14 : (medium ? 20 : 32);
  const shortLabel = (n) => {
    if (!n.data) return n.id;
    // For dense graphs, prefer the short code; otherwise show the name.
    const src = dense ? n.id : n.data.polity_name;
    return src.length > labelMax ? src.slice(0, labelMax - 1) + '…' : src;
  };

  const link = rootG.append('g').attr('stroke', '#666').attr('stroke-opacity', 0.55)
    .selectAll('line').data(links).enter().append('line')
    .attr('stroke-width', 1.2).attr('marker-end', 'url(#arrow)');

  const node = rootG.append('g').attr('class', 'nodes').selectAll('g').data(nodes).enter().append('g')
    .attr('class', 'graph-node').style('cursor', 'pointer');

  const hasPolygon = (d) => !d.missing && geoData && geoData._index && geoData._index[d.id];

  node.append('circle')
    .attr('r', d => sizeFor(d))
    .attr('fill', d => nodeColor(d, scope.colorBy))
    .attr('fill-opacity', d => hasPolygon(d) ? 1 : 0.35)
    .attr('stroke', d => d.id === selectedCode ? '#fff' : (d.missing ? '#ffb3b3' : (hasPolygon(d) ? 'rgba(255,255,255,0.25)' : '#ffd166')))
    .attr('stroke-width', d => d.id === selectedCode ? 2.5 : (hasPolygon(d) ? 1 : 1.5))
    .attr('stroke-dasharray', d => (d.missing || hasPolygon(d)) ? null : '3,2');

  const labels = node.append('text')
    .attr('dx', d => sizeFor(d) + 3).attr('dy', 3)
    .attr('font-size', labelFont)
    .attr('fill', d => d.missing ? '#ff8080' : '#ddd')
    .attr('stroke', '#0a0a14').attr('stroke-width', 2.5).attr('paint-order', 'stroke')
    .attr('pointer-events', 'none')
    .text(shortLabel);

  // Year-based dimming
  const activeForYear = (n) => {
    if (n.missing) return true;
    return n.data.start_year <= selectedYear && n.data.end_year >= selectedYear;
  };
  node.attr('opacity', d => activeForYear(d) ? 1 : 0.35);

  const tooltip = document.getElementById('graph-tooltip');
  node.on('mouseenter', (ev, d) => {
      const p = d.data;
      const polyNote = p
        ? (hasPolygon(d) ? '' : '<div style="color:#ffd166;margin-top:3px">No polygon (not on map)</div>')
        : '';
      tooltip.innerHTML = p
        ? `<div class="tt-name">${p.polity_name}</div>
           <div class="tt-code">${p.polity_code} &middot; ${p.start_year}–${p.end_year} &middot; ${p.polity_type}</div>
           <div style="color:#aaa">${p.continent}${p.wiki_status ? ' &middot; ' + p.wiki_status : ''}</div>${polyNote}`
        : `<div class="tt-name" style="color:#f66">Missing: ${d.id}</div><div class="tt-warn">Referenced but not in database</div>`;
      tooltip.style.display = 'block';
    })
    .on('mousemove', (ev) => {
      tooltip.style.left = (ev.clientX + 12) + 'px';
      tooltip.style.top = (ev.clientY + 12) + 'px';
    })
    .on('mouseleave', () => { tooltip.style.display = 'none'; })
    .on('click', (ev, d) => {
      ev.stopPropagation();
      if (d.missing) return;
      selectedCode = d.id;
      node.select('circle')
        .attr('stroke', n => n.id === selectedCode ? '#fff' : (n.missing ? '#ffb3b3' : 'rgba(255,255,255,0.25)'))
        .attr('stroke-width', n => n.id === selectedCode ? 2.5 : 1)
        .attr('r', n => sizeFor(n));
      showInfo(d.id);
    });

  // Approximate label width so collide radius keeps text from overlapping.
  const approxLabelWidth = (d) => shortLabel(d).length * labelFont * 0.55;
  const collideRadius = (d) => sizeFor(d) + 6 + approxLabelWidth(d) * 0.5;

  const linkDistance = dense ? 110 : (medium ? 160 : 220);
  const charge = dense ? -400 : (medium ? -900 : -1600);

  graphSim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(linkDistance).strength(0.35))
    .force('charge', d3.forceManyBody().strength(charge).distanceMax(1400).theta(0.9))
    .force('collide', d3.forceCollide().radius(collideRadius).strength(1).iterations(2))
    .force('x', d3.forceX(width / 2).strength(0.015))
    .force('y', d3.forceY(height / 2).strength(0.015))
    .alphaDecay(0.015)
    .velocityDecay(0.35)
    .on('tick', () => {
      link
        .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });

  const drag = d3.drag()
    .on('start', (ev, d) => { if (!ev.active) graphSim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
    .on('end', (ev, d) => { if (!ev.active) graphSim.alphaTarget(0); d.fx = null; d.fy = null; });
  node.call(drag);
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.body.classList.toggle('graph-mode', view === 'graph');
  document.body.classList.toggle('data-mode', view === 'data');
  const legend = document.getElementById('data-legend');
  if (legend) legend.style.display = (view === 'data' && dataActiveItem) ? 'block' : 'none';
  const um = document.getElementById('data-unmatched');
  if (um && view !== 'data') um.style.display = 'none';
  const np = document.getElementById('data-no-polygon');
  if (np && view !== 'data') np.style.display = 'none';
  if (view === 'graph') {
    requestAnimationFrame(() => renderGraph());
  } else if (view === 'data') {
    activateDataView();
  } else if (map) {
    map.resize();
    // Restore the year slider's full range when leaving Data view.
    slider.min = 1800; slider.max = 2025;
  }
}

function initGraphControls() {
  const continents = [...new Set(polities.map(p => p.continent).filter(Boolean))].sort();
  const cSel = document.getElementById('graph-continent');
  cSel.innerHTML = continents.map(c => `<option value="${c}">${c}</option>`).join('');
  // Default to the continent with the most polities so the first render is meaningful.
  const counts = {};
  polities.forEach(p => { counts[p.continent] = (counts[p.continent] || 0) + 1; });
  const defaultContinent = continents.sort((a, b) => (counts[b] || 0) - (counts[a] || 0))[0];
  if (defaultContinent) cSel.value = defaultContinent;

  const rerender = () => { if (currentView === 'graph') renderGraph(); };
  document.getElementById('graph-scope').addEventListener('change', () => { updateGraphControlsVisibility(); rerender(); });
  document.getElementById('graph-focus').addEventListener('change', rerender);

  // Typeahead dropdown for the focus polity field.
  const focusInput = document.getElementById('graph-focus');
  const focusResults = document.getElementById('graph-focus-results');
  const pickFocus = (code) => {
    focusInput.value = code;
    focusResults.classList.remove('open');
    focusResults.innerHTML = '';
    // Default to max hops when a new polity is picked so users see the whole chain.
    const hopsSlider = document.getElementById('graph-hops');
    hopsSlider.value = hopsSlider.max;
    document.getElementById('graph-hops-val').textContent = hopsSlider.max;
    rerender();
  };
  focusInput.addEventListener('input', () => {
    const q = focusInput.value.trim().toLowerCase();
    if (q.length < 2) { focusResults.classList.remove('open'); focusResults.innerHTML = ''; return; }
    const matches = polities.filter(p =>
      p.polity_name.toLowerCase().includes(q) || p.polity_code.toLowerCase().includes(q)
    ).slice(0, 12);
    if (!matches.length) { focusResults.classList.remove('open'); focusResults.innerHTML = ''; return; }
    focusResults.innerHTML = matches.map(p =>
      `<div class="result-item" data-code="${p.polity_code}">${p.polity_name} <span class="code">${p.polity_code} (${p.start_year}-${p.end_year})</span></div>`
    ).join('');
    focusResults.classList.add('open');
    focusResults.querySelectorAll('.result-item').forEach(el => {
      el.addEventListener('click', () => pickFocus(el.dataset.code));
    });
  });
  focusInput.addEventListener('blur', () => {
    // Delay so clicks on items register before hiding.
    setTimeout(() => focusResults.classList.remove('open'), 150);
  });
  focusInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = focusResults.querySelector('.result-item');
      if (first) { e.preventDefault(); pickFocus(first.dataset.code); }
    } else if (e.key === 'Escape') {
      focusResults.classList.remove('open');
    }
  });
  document.getElementById('graph-hops').addEventListener('input', (e) => {
    document.getElementById('graph-hops-val').textContent = e.target.value;
  });
  document.getElementById('graph-hops').addEventListener('change', rerender);
  document.getElementById('graph-continent').addEventListener('change', rerender);
  document.getElementById('graph-color').addEventListener('change', rerender);

  document.querySelectorAll('.tab-btn').forEach(b => {
    b.addEventListener('click', () => switchView(b.dataset.view));
  });

  window.addEventListener('resize', () => {
    if (currentView === 'graph') renderGraph();
    if (currentView === 'data' && dataMap) dataMap.resize();
  });
  updateGraphControlsVisibility();

  const dataDatasetSel = document.getElementById('data-dataset');
  if (dataDatasetSel) {
    dataDatasetSel.addEventListener('change', () => onDataDatasetChange(dataDatasetSel.value));
  }
  const dataMetricSel = document.getElementById('data-metric');
  if (dataMetricSel) {
    dataMetricSel.addEventListener('change', () => onDataMetricChange(dataMetricSel.value));
  }
  const dataItemSel = document.getElementById('data-item');
  if (dataItemSel) {
    dataItemSel.addEventListener('change', () => onDataItemChange(dataItemSel.value));
  }
}

// Init
async function init() {
  await Promise.all([loadCSV(), loadGeoJSON()]);
  document.getElementById('loading').style.display = 'none';

  buildPolityIndex();
  buildTypeFilters();
  initGraphControls();

  const colorExpr = ['coalesce', ['get', '_color'], '#888'];

  map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        'carto': {
          type: 'raster',
          tiles: ['https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'],
          tileSize: 256,
          attribution: '&copy; CARTO, &copy; OSM contributors'
        }
      },
      layers: [{ id: 'carto', type: 'raster', source: 'carto' }]
    },
    center: [20, 30],
    zoom: 2,
    maxZoom: 8
  });

  map.on('load', () => {
    map.addSource('polities', {
      type: 'geojson',
      data: buildFilteredGeoJSON()
    });

    map.addLayer({
      id: 'polities-fill',
      type: 'fill',
      source: 'polities',
      paint: {
        'fill-color': colorExpr,
        'fill-opacity': 0.45
      }
    });

    map.addLayer({
      id: 'polities-outline',
      type: 'line',
      source: 'polities',
      paint: {
        'line-color': colorExpr,
        'line-width': 1,
        'line-opacity': 0.6
      }
    });

    map.addSource('highlight', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });

    map.addLayer({
      id: 'highlight-fill',
      type: 'fill',
      source: 'highlight',
      paint: { 'fill-color': '#ffffff', 'fill-opacity': 0.25 }
    });

    map.addLayer({
      id: 'highlight-outline',
      type: 'line',
      source: 'highlight',
      paint: { 'line-color': '#ffffff', 'line-width': 2.5, 'line-opacity': 0.9 }
    });

    map.on('click', 'polities-fill', (e) => {
      if (e.features && e.features.length > 0) {
        togglePanel(false);
        showInfo(e.features[0].properties.polity_code);
      }
    });
    map.on('click', (e) => {
      const features = map.queryRenderedFeatures(e.point, { layers: ['polities-fill'] });
      if (!features.length) {
        selectedCode = null;
        updateHighlight();
        togglePanel(true);
      }
    });
    map.on('mouseenter', 'polities-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'polities-fill', () => { map.getCanvas().style.cursor = ''; });

    updateStats();
  });
}

init();
</script>
</body>
</html>
