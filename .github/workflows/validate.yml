name: Validate database

# The wiki is the source of truth and data/final is derived from it, so a page
# edit that is never propagated, or a polygon binding that resolves to the wrong
# country, is a correctness bug. Each check below exists because that class of
# error was found in the database, not hypothesised:
#
#   build_database --check   a wiki edit never propagated to the committed CSV
#   update_wiki_index --check wiki/index.md's counts drifting from reality (they
#                            had reached 1,325 polities against a real 740), and, since
#                            2026-08-05, the hand-typed status word on each curated
#                            entry: 65 of them contradicted the database, presenting 2
#                            RETIRED and 8 SUPERSEDED polities as `draft`, and 7 links
#                            pointed at pages that do not exist
#   write_manifest --check   the published consumer contract going stale. The WHEP
#                            R package embeds a copy of this database and had
#                            drifted to 603 rows against 740, routing 24 FAOSTAT
#                            area codes to retired/superseded polities
#   validate_polygons        8 polities carried ANOTHER COUNTRY'S polygon (San
#                            Marino had Albania's, 470x too large; Indonesia had
#                            India's); 28 declared a polygon the build never
#                            attached; 13 pages claimed wiki_status "reviewed"
#                            with no source citations
#   validate_citations       17 citations pointed at source files that were
#                            never ingested
#   audit_family_shadowing   Alaska outranked the United States and absorbed
#                            ~7,600 rows of mainland data; Hyderabad took
#                            India-labelled data
#   validate_constants       DEAD_STATUS is defined FIVE times and CLAIMS_POLYGON
#                            must equal the polygon vocabulary minus `unassigned`,
#                            with nothing linking them. Four legacy statuses once sat
#                            outside CLAIMS_POLYGON while 11 rows carrying them HAD
#                            geometry.
#   validate_spatial_        RUS-1991-2014 carries the USSR polygon (CShapes
#     containment            feature 365, 21.8M km2 against Russia's 17.1M) and
#                            geometrically contains Kazakhstan, Ukraine, the
#                            Baltics and 9 more. validate_polygons could not see
#                            it: that check compares against a hand-entered
#                            polygon_area_km2, and ~590 of 740 rows have none.
#   crosscheck_matchers      the two matchers in this repo (match.R and
#                            matchlib) disagreed on 3 of 281 FAOSTAT areas, each
#                            a real defect: Serbia 2006-2008 existing twice,
#                            "Malaysia" resolving to British North Borneo, and
#                            two aliases routing Viet Nam differently
#   validate_family_areas    check A in validate_polygons compares RECORDED against measured area
#                            and found eight polities carrying another country's polygon — but 520
#                            of the 684 rows claiming a polygon (76%) have no recorded area, so it
#                            cannot run on them. Comparing a period against its own family's median
#                            needs no external reference and covers all of them. Two anomalies
#                            today, both legitimate and explained by a field one column away: a
#                            polygon_feature_year of 1898 for COG-1900-1906, and the name "Eritrea
#                            (Italian coastal)" for ERI-1885-1889.
#
#   validate_source_change_steps
#                            validate_family_areas compares each period against its family
#                            MEDIAN, so a step change between two HALVES of a family leaves both
#                            halves in tolerance and is invisible. When the two halves also come
#                            from different polygon sources, the datasets' conventions are
#                            published as a territorial change at the boundary year. 39 steps
#                            change source; 17 move the area by 1.3x or more and each now carries
#                            a verdict. It found TUN-1800-1881 at 3.55x — the largest step in the
#                            database, and no event at all: the Paine polygon omitted the Beylik's
#                            north-western grain belt, 42,728 km2 of the 111,741 km2 difference,
#                            and the row was rebound to the CShapes vintage its own page had
#                            described all along. It also found OTT-1800-1886 publishing a 34%
#                            EXPANSION of an empire that was contracting, from 963,520 km2 of
#                            Ottoman Libya and Yemen that Cliopatria omits.
#
#   validate_cross_family_names
#                            validate_period_overlaps only sees overlaps WITHIN a prefix, and the
#                            same territory sometimes has two — a legacy prefix and an ISO3 one.
#                            Comparing normalised names across families found TAN-1922-1964
#                            overlapping TZA-1961-1964 and MAR-1911-1958 overlapping MOR-1956-1958,
#                            neither visible to that gate, plus independently re-deriving the known
#                            Serbia duplicate. Not duplicates: the earlier row's END year runs past
#                            where its successor begins.
#
#   validate_cow_codes       ICN-1800-2025 (Canary Islands) carried cow_code 20, which is CANADA.
#                            The Canaries are not a Correlates of War state at all — they are part
#                            of Spain, COW 230 — so the value was removed rather than corrected to
#                            230, which would have created a collision with esp-1800-2025 instead
#                            of fixing one. Neither an ISO check nor a polygon check could see it:
#                            both were fine. Found by asking which cow_codes are shared by
#                            polities whose spans overlap, which is now this gate.
#
#   validate_succession_geography
#                            NWR-1900-1905 (Northwestern Rhodesia) listed its successor as
#                            NNI-1904-1913 — Northern NIGERIA, 4,000 km away. A link can
#                            name a real, live polity and still be wrong; comparing the two
#                            polygons is what catches that. It reads the COMMITTED GeoPackage,
#                            so it runs here like everything else — I had excluded it on the
#                            assumption that it needed the raw geodata sources, which it does
#                            not.
#
#   validate_stated_areas    TUNISIA. Six IIA yearbook editions, 1911-1937, all state 125,130 km² —
#                            while TUN-1800-1881 carries 43,752 (paine-2024, 0.35x) and
#                            TUN-1881-2025 carries 155,482 (cshapes-2.0, 1.24x). BOTH polygons are
#                            wrong, in opposite directions, and the 3.55x step between them at 1881
#                            is entirely the two conventions meeting. Every other area check here
#                            compares one GIS product to another; this compares to what the
#                            statistical authority that PUBLISHED THE DATA believed the territory
#                            to be, which is the figure a per-km² denominator has to match.
#                            Compares against the RANGE the source states, not one figure: 61 of
#                            159 repeated (label, year) pairs disagree across editions, up to
#                            5.45x, so picking one statement picks an edition arbitrarily.
#
#   validate_polygon_validity 41 of 703 polygons fail is_valid, which quietly weakens
#                            validate_spatial_containment and validate_family_areas — both read
#                            the same geometries, and an invalid one makes contains/area
#                            unreliable without either gate reporting anything. The sweep that
#                            surfaced this blamed our own SimplifyPreserveTopology; checked, and
#                            it is mostly INHERITED — Cliopatria ships 2,239 invalid geometries of
#                            15,690, and all four of our Cliopatria rows are invalid at source.
#                            The gate measures rather than repairs, because make_valid and
#                            buffer(0) differ by 12,845 km² on Qajar Iran, so the repair method is
#                            itself a decision.
#
#   validate_order_decided_families
#                            197 Mitchell rows labelled `malaysia`, 1898-1945, resolved to British
#                            North BORNEO instead of British MALAYA, and 20 rows labelled `Libya
#                            Tripolitania` resolved to the Emirate of CYRENAICA — the other side of
#                            the country. Both because no candidate in those years is typed
#                            `national`, so matchlib falls back to the family list and takes the
#                            first. crosscheck_matchers had documented the Malaysia case (issue 44)
#                            at 1961 ONLY, because it resolves FAOSTAT labels and FAOSTAT starts in
#                            1961; issue 44 was then closed by a retype that fixed 1961 and left
#                            1881-1945 untouched. This gate scans from 1800, so a fix that merely
#                            moves a tie cannot close it again.
#
#   validate_chain_integrity TCD-1920-1960 listed WAD-1800-1912 (Wadai) as a SUCCESSOR — a polity
#                            that ended EIGHT YEARS BEFORE Chad's colonial row begins, and the same
#                            page's prose called it a predecessor while citing "the CSV", which is
#                            generated from that very frontmatter. Also: GRL and ISL each named the
#                            other as successor, forming a cycle, because `successor:` was being
#                            used for SOVEREIGNTY — a relation with no field in this schema. The
#                            geometry gate above had accepted 8 of those links as "overseas, need
#                            not touch": true, and the wrong question, since they were never
#                            successions. This gate asks the prior one — does the link work as
#                            chronology — plus whether targets exist, and whether page links
#                            resolve. That last signal found 4 broken links that predated it;
#                            validate_references checks citation markers, not inter-page links.
#   validate_s2_polygons     ten of the 703 polygons could not be LOADED by s2 at all, so
#                            sf::st_area() and sf::st_intersection() aborted on them
#                            instead of answering. Two were GEOS-valid, with two
#                            non-adjacent edges of one ring 4e-10 m apart -- one ULP --
#                            which GEOS reads as no intersection and s2, converting
#                            lon/lat to unit vectors first, reads as a crossing. Every
#                            other geometry gate here reasons in the plane, so none could
#                            see them, and make_valid() had nothing to repair. Live cost:
#                            FJI-1800-2025 is current and carries FAOSTAT area 66 across
#                            203,519 observed rows, and its polygon yielded ZERO grid
#                            cells (an abort) where live neighbour TON-1800-2025 yielded
#                            20. Repaired by scripts/repair_s2_polygons.py, which offers
#                            both of the repairs that disagree -- buffer(0) and make_valid
#                            differ by 12,845 km2 on Qajar Iran, the spread
#                            validate_polygon_validity declined to decide -- and defaults
#                            to the one that moves NO published area: seven of the ten
#                            change by 0.00 km2 in ESRI:54034 and none by over 21. Eight
#                            rows left that gate's invalid baseline as a by-product, so
#                            its pinned count is now 33.
#
#   validate_unranged_aliases
#                            the "Syria" alias had no source and no year range and pointed at
#                            SYR-1946-1967, so EVERY year — including 2020 — resolved to a
#                            polity that ended in 1967, across 162 observed rows. Unlike an
#                            inert alias this one worked; it just worked wrongly. Split at 1967
#                            to mirror the canonical label. Seven other unranged aliases to ended
#                            polities are fine and baselined, because their labels (Belgian
#                            Congo, French West Africa) are ones no modern source uses, plus
#                            "viet nam", which is unranged on purpose to catch year=NA rows.
#                            The rule is about an alias's UPPER bound, not whether it has both:
#                            "italy" ends at 1860 against a target ending 1860, which is
#                            correct, and only looked wrong to a first version of the check.
#
#   validate_iso_collisions  59 pairs of polities already share an iso3 over overlapping
#                            years, which is BY DESIGN (iso3 groups by modern territory:
#                            British North Borneo, Sarawak and British Malaya all carry
#                            MYS). The gate is that the set must not GROW, because each
#                            pair is a place an ISO+year lookup has to guess — the known
#                            cause of "Malaysia" 1961 resolving to British North Borneo.
#
#   validate_iso_codes       FRS-1977-2025 is modern Djibouti and carried `iso3: FRS`.
#                            Djibouti's ISO 3166-1 alpha-3 is DJI and FRS is not an ISO
#                            code at all, so a consumer holding a real country code could
#                            not reach the polity and matchlib fell back to matching on
#                            name. The polity-code PREFIX is a separate thing and stays.
#
#   validate_period_overlaps four pairs of live polities in the SAME family cover the
#                            same years, so a year-aware matcher cannot choose between
#                            them on history alone and falls back on tie-break order.
#                            PER-1825-1909 is the clearest: PER-1825-1884 and
#                            PER-1884-1909 tile its span exactly, so it is a redundant
#                            un-split row duplicating both.
#
#   validate_reporting_areas six GADM territories are claimed by TWO aggregate
#                            reporting polygons each. Palau and the Northern Mariana
#                            Islands sit in both Asia Other and Oceania Other; the
#                            Netherlands Antilles components sit in both ANT and Latin
#                            America Other for the 1961-2010 years the two spans share.
#                            These aggregates receive data, so two of them claiming the
#                            same ground puts two values on one territory — and the ROW
#                            union hides it, because unary_union deduplicates.
#
#   validate_aliases         five aliases were silently INERT — two had an
#                            unquoted comma in a field, which shifted every
#                            column and dropped the target; one targeted a bare
#                            family prefix; one a polity that does not exist. A
#                            broken alias does not fail, it just never matches.
#   write_faostat_area_map   WHEP rebuilt the FAOSTAT area -> polity mapping
#     --check                itself and could not reach colonial-era polities,
#                            attributing 118 area-years to polities that did
#                            not exist (50 of them Sudan). The map is published
#                            so consumers read it instead of guessing.
#
# These need only what the repo commits (wiki/, data/final/). The MATCHERS are
# deliberately absent: they need the layer-B parquet and the FAOSTAT pins cache,
# which live outside the repo — see issue #17.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'data/final/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  # NO paths filter on pull_request, deliberately. With one, a PR touching only
  # pipelines/** reported "no checks reported" and could have merged with zero
  # validation — the absence of a check is silent, which is the worst failure
  # mode for a gate. The suite takes ~90s, so running it on every PR is cheap
  # insurance. The push filter stays, since pushes to main are already covered
  # by whichever PR introduced them.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # GDAL is needed twice over: build_database.py imports osgeo.ogr, and
      # geopandas reads the committed GeoPackage. The apt python3-gdal build is
      # used rather than a pip GDAL because the pip package must match the system
      # library version exactly, which is brittle on runners.
      - name: Install GDAL and Python dependencies
        run: |
          sudo apt-get update -qq
          # libgdal-dev REMOVED 2026-08-07. It exists to COMPILE against GDAL and nothing in this
          # workflow compiles: python3-gdal supplies the `osgeo` bindings that build_database.py,
          # validate_polygon_binding_determinism.py and write_feature_index.py import, gdal-bin
          # supplies ogr2ogr, and everything else reaches GDAL through geopandas/pyogrio wheels.
          # It was the bottleneck: on run 31167317554 the install step alone ran past 28 MINUTES
          # with every gate queued behind it, while `cache: pip` above meant pip was not the cause.
          # apt has no cache here, so the dependency tree is paid in full on every run.
          sudo apt-get install -y -qq --no-install-recommends gdal-bin python3-gdal
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          # expose the apt-installed osgeo bindings to the setup-python interpreter
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> "$GITHUB_ENV"

      - name: Report versions
        run: |
          python -c "import sys, pandas, geopandas; print(sys.version); print('pandas', pandas.__version__, '| geopandas', geopandas.__version__)"
          python -c "from osgeo import gdal; print('gdal', gdal.__version__)"

      # Each check runs even if an earlier one failed, so one push surfaces every
      # problem rather than only the first.
      - name: Published tables still have the columns consumers read
        run: python3 scripts/validate_schema_contract.py

      - name: Citations resolve to real sources and anchors
        if: '!cancelled()'
        run: python3 scripts/validate_citations.py

      - name: Committed CSV matches the wiki
        if: '!cancelled()'
        run: python3 scripts/build_database.py --check

      # The map is checked BEFORE the manifest, because the manifest fingerprints
      # it: a stale map makes the manifest stale too, and the specific message
      # ("the map does not match the pipeline state") is more useful to a reader
      # than the general one it would also trigger.
      - name: Published FAOSTAT area map matches the pipeline state
        if: '!cancelled()'
        run: python3 scripts/write_faostat_area_map.py --check

      - name: The external-data guards can still fail
        # extdata.py asserts the columns and categorical VALUES of the datasets the
        # autoimprove pipeline reads. Its self-test uses synthetic frames, so unlike
        # the pipeline itself it runs anywhere. Here for the same reason
        # selftest_gates exists: a guard that is only hand-tested decays quietly.
        run: python3 pipelines/polity-autoimprove/extdata.py

      - name: The polygon feature index still matches its sources
        # SKIPs in CI, where data/geodata is gitignored: rebuilding from a partial
        # set of sources would delete the rows of every unfetched one. It verifies
        # locally, which is where the index is regenerated.
        run: python3 scripts/write_feature_index.py --check

      - name: Consumer manifest matches the database
        if: '!cancelled()'
        run: python3 scripts/write_manifest.py --check

      - name: Wiki index coverage table is current
        if: '!cancelled()'
        run: python3 scripts/update_wiki_index.py --check

      - name: territory_basis.csv still describes the current database
        if: '!cancelled()'
        run: python3 pipelines/polity-autoimprove/04_territory_basis.py --check

      - name: source_stated_areas.csv still matches the yearbooks
        if: '!cancelled()'
        run: python3 pipelines/polity-autoimprove/08_source_stated_areas.py --check

      - name: iso3_successor_map.csv still matches the chain graph
        if: '!cancelled()'
        run: python3 scripts/write_iso3_successor_map.py --check

      # site/ is PUBLISHED output -- pages.yml deploys it on every change -- and until this
      # step existed `site/` appeared in exactly one workflow: the one that publishes it.
      - name: site/ shows exactly the live polities that carry geometry
        if: '!cancelled()'
        run: python3 scripts/validate_site_outputs.py

      # Added after sixteen territories got polities and stayed listed as having none, so their
      # data still resolved to ROW-1850-2025. Nothing linked the two files; now something does.
      - name: areas listed as unmapped really have no polity to map them to
        if: '!cancelled()'
        run: python3 scripts/validate_registry_unmapped.py

      - name: Polygons — area agreement, claimed-but-absent, reviewed-means-documented
        if: '!cancelled()'
        run: python3 scripts/validate_polygons.py

      # The polygon we publish must be the polygon we read (issue 71). build_database.py
      # simplifies, densifies and repairs before writing, and simplification alone once
      # deleted 42% of the Maldives -- which made `polygon_area_km2` unfillable, because the
      # page could either state the truth and fail check A or state the rendering and
      # understate the country. The reference is polygon_feature_index.csv's `area_km2`,
      # measured from the raw source, so this needs no data/geodata and runs here.
      - name: Shipped polygons still measure what their sources measure
        if: '!cancelled()'
        run: python3 scripts/validate_simplification_loss.py

      - name: No new invalid geometry in the published GeoPackage
        if: '!cancelled()'
        run: python3 scripts/validate_polygon_validity.py

      - name: Polygons agree with the areas the sources state for themselves
        if: '!cancelled()'
        run: python3 scripts/validate_stated_areas.py

      - name: Wiki pages only name things that exist
        if: '!cancelled()'
        run: python3 scripts/validate_references.py

      - name: No polity can shadow a sibling via family ordering
        if: '!cancelled()'
        run: python3 scripts/audit_family_shadowing.py

      - name: Every alias can actually route to a live polity
        if: '!cancelled()'
        run: python3 scripts/validate_aliases.py

      - name: Duplicated constants still agree
        if: '!cancelled()'
        run: python3 scripts/validate_constants.py

      - name: No territory belongs to two reporting aggregates
        if: '!cancelled()'
        run: python3 scripts/validate_reporting_areas.py

      - name: No two periods of one family cover the same year
        if: '!cancelled()'
        run: python3 scripts/validate_period_overlaps.py

      - name: No FAOSTAT area-year has two live polity answers
        if: '!cancelled()'
        run: python3 scripts/validate_map_area_year.py

      - name: No family leaves a year covered by nothing
        if: '!cancelled()'
        run: python3 scripts/validate_period_gaps.py

      - name: No alias claims a year its polity does not cover
        if: '!cancelled()'
        run: python3 scripts/validate_alias_year_coverage.py

      - name: Live polities carry real ISO 3166-1 codes
        if: '!cancelled()'
        run: python3 scripts/validate_iso_codes.py

      - name: No new pair shares an ISO code over the same years
        if: '!cancelled()'
        run: python3 scripts/validate_iso_collisions.py

      - name: Dissolved states with an ISO 3166-3 code follow one coding rule
        if: '!cancelled()'
        run: python3 scripts/validate_dissolved_iso_codes.py

      - name: No unranged alias points at an ended polity
        if: '!cancelled()'
        run: python3 scripts/validate_unranged_aliases.py

      - name: Succession links join territories that touch
        if: '!cancelled()'
        run: python3 scripts/validate_succession_geography.py

      - name: The succession graph is a coherent chronology
        if: '!cancelled()'
        run: python3 scripts/validate_chain_integrity.py

      - name: No new pair shares a Correlates of War code
        if: '!cancelled()'
        run: python3 scripts/validate_cow_codes.py

      - name: No two families share a name over the same years
        if: '!cancelled()'
        run: python3 scripts/validate_cross_family_names.py

      - name: No period is wildly out of scale with its own family
        if: '!cancelled()'
        run: python3 scripts/validate_family_areas.py

      - name: No area step coincides with a polygon-source change unaccounted for
        if: '!cancelled()'
        run: python3 scripts/validate_source_change_steps.py

      - name: Published label alias map matches the registry
        if: '!cancelled()'
        run: python3 scripts/write_label_alias_map.py --check

      - name: The two matchers agree with each other
        if: '!cancelled()'
        run: python3 scripts/crosscheck_matchers.py

      - name: No label's route is decided by family order
        if: '!cancelled()'
        run: python3 scripts/validate_order_decided_families.py

      - name: Polygon bindings belong to the period their row covers
        # Reads the committed feature index and GeoPackage only, so unlike the
        # determinism gate this one does real work in CI from the start. Found eight
        # wrong bindings across five families, none visible to an area check.
        run: python3 scripts/validate_polygon_period_fit.py

      - name: Polygon bindings are decided by the data, not by shapefile row order
        # Reads data/final/polygon_feature_index.csv, so this runs for real in CI (issue
        # 103). It previously needed the gitignored shapefiles and verified nothing here.
        run: python3 scripts/validate_polygon_binding_determinism.py

      - name: Polygons — no swallowed neighbour, no discontinuous family
        if: '!cancelled()'
        run: python3 scripts/validate_spatial_containment.py

      - name: Polygons — measurable on the sphere, not just in the plane
        # Every other geometry gate reasons in the plane, so none could see that ten
        # polygons were unloadable by s2 -- two of them while GEOS-valid, carrying a
        # pinch 4e-10 m wide that GEOS reads as no intersection and s2, which rounds
        # lon/lat onto unit vectors, reads as a crossing. sf::st_area() and
        # sf::st_intersection() both ABORT on those, so the territory leaves a gridded
        # build rather than arriving wrong. FJI-1800-2025 is live today and FAOSTAT area
        # 66 routes to it across 203,519 observed rows: its polygon raised
        # "Loop 82 edge 4 crosses loop 332 edge 2" against a 0.5-degree grid where live
        # neighbour TON-1800-2025 returned 20 cells. Asks s2 itself, via spherely, since
        # a gate that only approximates it can pass while the consumer aborts.
        if: '!cancelled()'
        run: python3 scripts/validate_s2_polygons.py
      - name: Polygons — a planar straight border still renders as a straight border
        # The 49th-parallel US/Canada border shipped as ONE segment 27.6 degrees of
        # longitude wide, and under s2 -- which sf uses by default, and which any
        # geodesic area requires -- a segment is a GREAT CIRCLE bulging poleward
        # between two equal-latitude points. It therefore rendered as an arc reaching
        # latitude 49.83, 92 km into Canada, booking 12.33 Mha of Canadian prairie to
        # the United States. NOT ONE OTHER CHECK HERE COULD SEE IT: USA + CAN =
        # 1.0000 in every cell, no overlap, no gap, planar area identical to the bit.
        # A clean mutual displacement, and every gate above is either planar or
        # conservation-based -- conservation detects non-conservation, never
        # misattribution. Half the cause was ours: CShapes stores that border with
        # 124 vertices and build_database.py's own 0.01-degree Douglas-Peucker
        # deleted all 124, because DP measures deviation from the chord in PLANAR
        # degrees. eduaguilera/whep#529.
        if: '!cancelled()'
        run: python3 scripts/validate_spherical_edges.py
      - name: Polygons — no two coexisting polities on one polygon
        # Measured in the consumer, which is where it surfaced: WHEP's embedded copy
        # has TWELVE cross-family pairs coexisting on one polygon, and for 2015 451 of
        # 67,691 grid cells claim more territory than they contain, 12.72 Mha in excess,
        # worst ratio 2.0000x at cell (10.25, 1.75) — GNQ-1968-2025 and STP-1800-2025
        # both bound to CShapes feature 411. The defect was injected back into a copy of
        # this repository at the wiki, the CSV and the GeoPackage together, and all 27
        # gates then exited 0 without naming STP-1800-2025: the area check had no
        # recorded area to compare, the containment check needs three swallowed
        # neighbours and two identical polygons swallow one each, and the period-fit and
        # determinism checks confirm that 411@1900 resolves cleanly — it is simply the
        # wrong country. Nothing asked whether another live polity already held it.
        if: '!cancelled()'
        run: python3 scripts/validate_shared_polygons.py


      - name: Identity — a code's years match its own columns
        if: '!cancelled()'
        run: python3 scripts/validate_code_year_agreement.py

      - name: Identity — every component reads end_year the same way
        # `end_year` is EXCLUSIVE here and matchlib read it INCLUSIVELY, so at a
        # transition year an ENDED period competed for the year and, wherever a third
        # row overlapped the family, won on list order: 12 layer-B (label, source,
        # year) tuples carrying 190 rows resolved to a polity that had already ended,
        # every India transition among them. Nothing errored — both readings return a
        # live, plausibly-dated polity — and issue #77's "four territory-years fall in
        # no polity" turned out to be ONE, the other three being artefacts of
        # measuring with one convention against data governed by the other. The gate
        # compares one NAMED constant across the three components that resolve a year,
        # checks wiki/README.md states it (it did not state it at all), and asks the
        # matcher whether an ended period still wins its own boundary year.
        #
        # It also holds the OTHER field, which reads the other way on purpose: alias
        # `year_end` is INCLUSIVE, so a consistent pair is end_year == year_end + 1.
        # That reading was still unnamed, and matchlib.assign applied it to the
        # TARGET's exclusive end_year for every alias, including blanket ones that
        # claim no year at all — 219 of 903 rules could reach their target's end_year
        # and 19 did so without declaring it.
        if: '!cancelled()'
        run: python3 scripts/validate_year_semantics.py

      - name: Aliases — consecutive ranges in a chain do not touch
        if: '!cancelled()'
        run: python3 scripts/validate_alias_chain_overlaps.py

      - name: Names — one live polity per name and year, so a name can resolve
        if: '!cancelled()'
        run: python3 scripts/validate_live_name_ambiguity.py

      - name: Identity — the iso3_code vocabulary is stable, since consumers join on it
        if: '!cancelled()'
        run: python3 scripts/validate_local_iso_codes.py

      - name: Coverage — every polity that receives data carries a polygon
        if: '!cancelled()'
        run: python3 scripts/validate_data_without_geometry.py

      # Last, because it is the only step that answers "can the steps above
      # fail?". Twenty-one gates that all pass are indistinguishable, from a
      # green summary, from twenty-one gates that cannot fail.
      - name: Gates — prove they fail on an injected defect
        if: '!cancelled()'
        run: python3 scripts/selftest_gates.py
