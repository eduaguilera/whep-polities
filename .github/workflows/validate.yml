name: Validate database

# The wiki is the source of truth and data/final is derived from it, so a page
# edit that is never propagated, or a polygon binding that resolves to the wrong
# country, is a correctness bug. Each check below exists because that class of
# error was found in the database, not hypothesised:
#
#   build_database --check   a wiki edit never propagated to the committed CSV
#   update_wiki_index --check wiki/index.md's counts drifting from reality (they
#                            had reached 1,325 polities against a real 740), and, since
#                            2026-08-05, the hand-typed status word on each curated
#                            entry: 65 of them contradicted the database, presenting 2
#                            RETIRED and 8 SUPERSEDED polities as `draft`, and 7 links
#                            pointed at pages that do not exist
#   write_manifest --check   the published consumer contract going stale. The WHEP
#                            R package embeds a copy of this database and had
#                            drifted to 603 rows against 740, routing 24 FAOSTAT
#                            area codes to retired/superseded polities
#   validate_polygons        8 polities carried ANOTHER COUNTRY'S polygon (San
#                            Marino had Albania's, 470x too large; Indonesia had
#                            India's); 28 declared a polygon the build never
#                            attached; 13 pages claimed wiki_status "reviewed"
#                            with no source citations
#   validate_citations       17 citations pointed at source files that were
#                            never ingested
#   audit_family_shadowing   Alaska outranked the United States and absorbed
#                            ~7,600 rows of mainland data; Hyderabad took
#                            India-labelled data
#   validate_constants       DEAD_STATUS is defined FIVE times and CLAIMS_POLYGON
#                            must equal the polygon vocabulary minus `unassigned`,
#                            with nothing linking them. Four legacy statuses once sat
#                            outside CLAIMS_POLYGON while 11 rows carrying them HAD
#                            geometry.
#   validate_spatial_        RUS-1991-2014 carries the USSR polygon (CShapes
#     containment            feature 365, 21.8M km2 against Russia's 17.1M) and
#                            geometrically contains Kazakhstan, Ukraine, the
#                            Baltics and 9 more. validate_polygons could not see
#                            it: that check compares against a hand-entered
#                            polygon_area_km2, and ~590 of 740 rows have none.
#   crosscheck_matchers      the two matchers in this repo (match.R and
#                            matchlib) disagreed on 3 of 281 FAOSTAT areas, each
#                            a real defect: Serbia 2006-2008 existing twice,
#                            "Malaysia" resolving to British North Borneo, and
#                            two aliases routing Viet Nam differently. It asked
#                            each mapping about its MIDPOINT year only, so it
#                            could not see the shared-transition-year rule every
#                            one of those divergences turned on; probing the
#                            first and last year too (issue 16) took 297 probes
#                            to 874 and disagreements from 1 to 9, and it now
#                            also pins 19 golden routing decisions by hand
#   validate_family_areas    check A in validate_polygons compares RECORDED against measured area
#                            and found eight polities carrying another country's polygon — but 520
#                            of the 684 rows claiming a polygon (76%) have no recorded area, so it
#                            cannot run on them. Comparing a period against its own family's median
#                            needs no external reference and covers all of them. Two anomalies
#                            today, both legitimate and explained by a field one column away: a
#                            polygon_feature_year of 1898 for COG-1900-1906, and the name "Eritrea
#                            (Italian coastal)" for ERI-1885-1889.
#
#   validate_source_change_steps
#                            validate_family_areas compares each period against its family
#                            MEDIAN, so a step change between two HALVES of a family leaves both
#                            halves in tolerance and is invisible. When the two halves also come
#                            from different polygon sources, the datasets' conventions are
#                            published as a territorial change at the boundary year. 39 steps
#                            change source; 17 move the area by 1.3x or more and each now carries
#                            a verdict. It found TUN-1800-1881 at 3.55x — the largest step in the
#                            database, and no event at all: the Paine polygon omitted the Beylik's
#                            north-western grain belt, 42,728 km2 of the 111,741 km2 difference,
#                            and the row was rebound to the CShapes vintage its own page had
#                            described all along. It also found OTT-1800-1886 publishing a 34%
#                            EXPANSION of an empire that was contracting, from 963,520 km2 of
#                            Ottoman Libya and Yemen that Cliopatria omits.
#
#   validate_cross_family_names
#                            validate_period_overlaps used to see overlaps only WITHIN a prefix
#                            (it gained a cross-family signal on 2026-08-14, issue 82), and the
#                            same territory sometimes has two — a legacy prefix and an ISO3 one.
#                            Comparing normalised names across families found TAN-1922-1964
#                            overlapping TZA-1961-1964 and MAR-1911-1958 overlapping MOR-1956-1958,
#                            neither visible to that gate, plus independently re-deriving the known
#                            Serbia duplicate. Not duplicates: the earlier row's END year runs past
#                            where its successor begins.
#
#   validate_cow_codes       ICN-1800-2025 (Canary Islands) carried cow_code 20, which is CANADA.
#                            The Canaries are not a Correlates of War state at all — they are part
#                            of Spain, COW 230 — so the value was removed rather than corrected to
#                            230, which would have created a collision with esp-1800-2025 instead
#                            of fixing one. Neither an ISO check nor a polygon check could see it:
#                            both were fine. Found by asking which cow_codes are shared by
#                            polities whose spans overlap, which is now this gate.
#
#   validate_succession_geography
#                            NWR-1900-1905 (Northwestern Rhodesia) listed its successor as
#                            NNI-1904-1913 — Northern NIGERIA, 4,000 km away. A link can
#                            name a real, live polity and still be wrong; comparing the two
#                            polygons is what catches that. It reads the COMMITTED GeoPackage,
#                            so it runs here like everything else — I had excluded it on the
#                            assumption that it needed the raw geodata sources, which it does
#                            not.
#
#   validate_stated_areas    TUNISIA. Six IIA yearbook editions, 1911-1937, all state 125,130 km² —
#                            while TUN-1800-1881 carries 43,752 (paine-2024, 0.35x) and
#                            TUN-1881-2025 carries 155,482 (cshapes-2.0, 1.24x). BOTH polygons are
#                            wrong, in opposite directions, and the 3.55x step between them at 1881
#                            is entirely the two conventions meeting. Every other area check here
#                            compares one GIS product to another; this compares to what the
#                            statistical authority that PUBLISHED THE DATA believed the territory
#                            to be, which is the figure a per-km² denominator has to match.
#                            Compares against the RANGE the source states, not one figure: 61 of
#                            159 repeated (label, year) pairs disagree across editions, up to
#                            5.45x, so picking one statement picks an edition arbitrarily.
#
#   validate_polygon_validity 41 of 703 polygons fail is_valid, which quietly weakens
#                            validate_spatial_containment and validate_family_areas — both read
#                            the same geometries, and an invalid one makes contains/area
#                            unreliable without either gate reporting anything. The sweep that
#                            surfaced this blamed our own SimplifyPreserveTopology; checked, and
#                            it is mostly INHERITED — Cliopatria ships 2,239 invalid geometries of
#                            15,690, and all four of our Cliopatria rows are invalid at source.
#                            The gate measures rather than repairs, because make_valid and
#                            buffer(0) differ by 12,845 km² on Qajar Iran, so the repair method is
#                            itself a decision.
#
#   validate_order_decided_families
#                            197 Mitchell rows labelled `malaysia`, 1898-1945, resolved to British
#                            North BORNEO instead of British MALAYA, and 20 rows labelled `Libya
#                            Tripolitania` resolved to the Emirate of CYRENAICA — the other side of
#                            the country. Both because no candidate in those years is typed
#                            `national`, so matchlib falls back to the family list and takes the
#                            first. crosscheck_matchers had documented the Malaysia case (issue 44)
#                            at 1961 ONLY, because it resolves FAOSTAT labels and FAOSTAT starts in
#                            1961; issue 44 was then closed by a retype that fixed 1961 and left
#                            1881-1945 untouched. This gate scans from 1800, so a fix that merely
#                            moves a tie cannot close it again.
#
#   validate_chain_integrity TCD-1920-1960 listed WAD-1800-1912 (Wadai) as a SUCCESSOR — a polity
#                            that ended EIGHT YEARS BEFORE Chad's colonial row begins, and the same
#                            page's prose called it a predecessor while citing "the CSV", which is
#                            generated from that very frontmatter. Also: GRL and ISL each named the
#                            other as successor, forming a cycle, because `successor:` was being
#                            used for SOVEREIGNTY — a relation with no field in this schema. The
#                            geometry gate above had accepted 8 of those links as "overseas, need
#                            not touch": true, and the wrong question, since they were never
#                            successions. This gate asks the prior one — does the link work as
#                            chronology — plus whether targets exist, and whether page links
#                            resolve. That last signal found 4 broken links that predated it;
#                            validate_references checks citation markers, not inter-page links.
#   validate_s2_polygons     ten of the 703 polygons could not be LOADED by s2 at all, so
#                            sf::st_area() and sf::st_intersection() aborted on them
#                            instead of answering. Two were GEOS-valid, with two
#                            non-adjacent edges of one ring 4e-10 m apart -- one ULP --
#                            which GEOS reads as no intersection and s2, converting
#                            lon/lat to unit vectors first, reads as a crossing. Every
#                            other geometry gate here reasons in the plane, so none could
#                            see them, and make_valid() had nothing to repair. Live cost:
#                            FJI-1800-2025 is current and carries FAOSTAT area 66 across
#                            203,519 observed rows, and its polygon yielded ZERO grid
#                            cells (an abort) where live neighbour TON-1800-2025 yielded
#                            20. Repaired by scripts/repair_s2_polygons.py, which offers
#                            both of the repairs that disagree -- buffer(0) and make_valid
#                            differ by 12,845 km2 on Qajar Iran, the spread
#                            validate_polygon_validity declined to decide -- and defaults
#                            to the one that moves NO published area: seven of the ten
#                            change by 0.00 km2 in ESRI:54034 and none by over 21. Eight
#                            rows left that gate's invalid baseline as a by-product, so
#                            its pinned count is now 33.
#
#   validate_unranged_aliases
#                            the "Syria" alias had no source and no year range and pointed at
#                            SYR-1946-1967, so EVERY year — including 2020 — resolved to a
#                            polity that ended in 1967, across 162 observed rows. Unlike an
#                            inert alias this one worked; it just worked wrongly. Split at 1967
#                            to mirror the canonical label. Seven other unranged aliases to ended
#                            polities are fine and baselined, because their labels (Belgian
#                            Congo, French West Africa) are ones no modern source uses, plus
#                            "viet nam", which is unranged on purpose to catch year=NA rows.
#                            The rule is about an alias's UPPER bound, not whether it has both:
#                            "italy" ends at 1860 against a target ending 1860, which is
#                            correct, and only looked wrong to a first version of the check.
#
#   validate_iso_collisions  59 pairs of polities already share an iso3 over overlapping
#                            years, which is BY DESIGN (iso3 groups by modern territory:
#                            British North Borneo, Sarawak and British Malaya all carry
#                            MYS). The gate is that the set must not GROW, because each
#                            pair is a place an ISO+year lookup has to guess — the known
#                            cause of "Malaysia" 1961 resolving to British North Borneo.
#
#   validate_iso_codes       FRS-1977-2025 is modern Djibouti and carried `iso3: FRS`.
#                            Djibouti's ISO 3166-1 alpha-3 is DJI and FRS is not an ISO
#                            code at all, so a consumer holding a real country code could
#                            not reach the polity and matchlib fell back to matching on
#                            name. The polity-code PREFIX is a separate thing and stays.
#
#   validate_period_overlaps four pairs of live polities in the SAME family cover the
#                            same years, so a year-aware matcher cannot choose between
#                            them on history alone and falls back on tie-break order.
#                            PER-1825-1909 is the clearest: PER-1825-1884 and
#                            PER-1884-1909 tile its span exactly, so it is a redundant
#                            un-split row duplicating both. All four are now fixed and
#                            the same-family baseline is empty.
#                            A CROSS-FAMILY signal was added 2026-08-14 for issue 82,
#                            reading the succession edges in iso3_successor_map.csv
#                            rather than guessing the link from iso3_code: 53 pairs
#                            today, all baselined and none a duplicate (25 nested, 25
#                            disjoint ground, 3 without geometry). It would have caught
#                            the Morocco pair the issue reported, which no same-prefix
#                            comparison can see.
#
#   validate_reporting_areas six GADM territories are claimed by TWO aggregate
#                            reporting polygons each. Palau and the Northern Mariana
#                            Islands sit in both Asia Other and Oceania Other; the
#                            Netherlands Antilles components sit in both ANT and Latin
#                            America Other for the 1961-2010 years the two spans share.
#                            These aggregates receive data, so two of them claiming the
#                            same ground puts two values on one territory — and the ROW
#                            union hides it, because unary_union deduplicates.
#
#   validate_aliases         five aliases were silently INERT — two had an
#                            unquoted comma in a field, which shifted every
#                            column and dropped the target; one targeted a bare
#                            family prefix; one a polity that does not exist. A
#                            broken alias does not fail, it just never matches.
#   write_faostat_area_map   WHEP rebuilt the FAOSTAT area -> polity mapping
#     --check                itself and could not reach colonial-era polities,
#                            attributing 118 area-years to polities that did
#                            not exist (50 of them Sudan). The map is published
#                            so consumers read it instead of guessing.
#
#   validate_matcher_orphan_guard
#                            the matchers still cannot RUN here, but their OUTPUT can be
#                            checked here: a row of data/final/faostat_area_polity_map.csv
#                            retargeted to a fabricated ZZZ-1800-1900 passes NINE of the TEN
#                            gates that read that file, because the only one that joins on the
#                            code (validate_map_area_year) SKIPS rows whose code is not live
#                            (the tenth, crosscheck_matchers, does catch it). That is the #244
#                            failure one step further out — five codes carrying 799 rows once
#                            sat in the layer-B match while territory_basis published 0 rows
#                            for their successors. This checks the committed crosswalks
#                            against the live polity set (1,540 references, 0 unroutable) and
#                            checks that each matcher still refuses to WRITE an unroutable
#                            one — the part that matters most, since two of those outputs
#                            (matched_rows.parquet, data/compiled/pre1961/matched.csv) are
#                            gitignored and no gate here can ever read them.
#
# These need only what the repo commits (wiki/, data/final/). The MATCHERS are
# deliberately absent: they need the layer-B parquet and the FAOSTAT pins cache,
# which live outside the repo — see issue #17. Their output is checked here even so,
# by validate_matcher_orphan_guard; what remains unverifiable in CI is the match COUNT.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'data/final/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  # NO paths filter on pull_request, deliberately. With one, a PR touching only
  # pipelines/** reported "no checks reported" and could have merged with zero
  # validation — the absence of a check is silent, which is the worst failure
  # mode for a gate. The suite takes ~90s, so running it on every PR is cheap
  # insurance. The push filter stays, since pushes to main are already covered
  # by whichever PR introduced them.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # GDAL is needed twice over: build_database.py imports osgeo.ogr, and
      # geopandas reads the committed GeoPackage. The apt python3-gdal build is
      # used rather than a pip GDAL because the pip package must match the system
      # library version exactly, which is brittle on runners.
      - name: Install GDAL and Python dependencies
        run: |
          sudo apt-get update -qq
          # libgdal-dev REMOVED 2026-08-07. It exists to COMPILE against GDAL and nothing in this
          # workflow compiles: python3-gdal supplies the `osgeo` bindings that build_database.py,
          # validate_polygon_binding_determinism.py and write_feature_index.py import, gdal-bin
          # supplies ogr2ogr, and everything else reaches GDAL through geopandas/pyogrio wheels.
          # It was the bottleneck: on run 31167317554 the install step alone ran past 28 MINUTES
          # with every gate queued behind it, while `cache: pip` above meant pip was not the cause.
          # apt has no cache here, so the dependency tree is paid in full on every run.
          sudo apt-get install -y -qq --no-install-recommends gdal-bin python3-gdal
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          # expose the apt-installed osgeo bindings to the setup-python interpreter
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> "$GITHUB_ENV"

      - name: Report versions
        run: |
          python -c "import sys, pandas, geopandas; print(sys.version); print('pandas', pandas.__version__, '| geopandas', geopandas.__version__)"
          python -c "from osgeo import gdal; print('gdal', gdal.__version__)"

      # Each check runs even if an earlier one failed, so one push surfaces every
      # problem rather than only the first.
      - name: Published tables still have the columns consumers read
        run: python3 scripts/validate_schema_contract.py

      - name: Layer B's misnamed polity_code is renamed at every read
        # Layer B's column NAMED `polity_code` holds LOWERCASE ISO CODES: measured
        # 2026-08-17, 192,670 rows, 166 distinct values, 99.37% exactly lower(iso3c), and
        # 0 of the 166 equal to any polity_code in the database. So
        # `layer_b.merge(polities, on="polity_code")` returns an EMPTY frame and raises
        # nothing — a table of zeros was nearly published as evidence that no data existed
        # in those years (issue 95, option 4). The parquet is built outside this repo, so
        # its header cannot be fixed here; what is enforced instead is that no frame held
        # in this repo carries the lying name. A source check, not a data check, because
        # layer B is not redistributable and CI cannot read it — the loader-side guard
        # existed already and two of its three callers passed no `polity_codes`, so it
        # compared against an empty set and passed for that reason.
        if: '!cancelled()'
        run: python3 scripts/validate_layer_b_column_guard.py

      - name: Citations resolve to real sources and anchors
        if: '!cancelled()'
        run: python3 scripts/validate_citations.py

      - name: No new data-receiving polity is documented only by a stub page
        # validate_citations proves a citation is real; this proves there is one to make.
        # A polity that receives layer-B rows behind a CSV-derived stub is a place where
        # verification has to lean on an earlier agent's hypothesis (issue 19). 45 of the 460
        # data-receiving polities were in that state on main; fourteen were documented and the
        # remaining 31 (1,005 rows) are baselined bidirectionally, so the set can only shrink.
        if: '!cancelled()'
        run: python3 scripts/validate_page_depth.py

      - name: Declared sources resolve, and a data-receiving page names one
        # The other citation channel. validate_citations checks INLINE links; nothing read
        # the `sources:` frontmatter key at all, so a page could name any string and no
        # check would notice — 146 of 775 pages declared one of 38 slugs with no file under
        # wiki/sources/ (issue 19's follow-up). Six were cleared (one source registered, 53
        # pages' slugs corrected); the remaining 32 are baselined per slug as a worklist,
        # and no data-receiving page now names no source at all.
        if: '!cancelled()'
        run: python3 scripts/validate_declared_sources.py

      - name: Committed CSV matches the wiki
        if: '!cancelled()'
        run: python3 scripts/build_database.py --check

      # The map is checked BEFORE the manifest, because the manifest fingerprints
      # it: a stale map makes the manifest stale too, and the specific message
      # ("the map does not match the pipeline state") is more useful to a reader
      # than the general one it would also trigger.
      - name: Published FAOSTAT area map matches the pipeline state
        if: '!cancelled()'
        run: python3 scripts/write_faostat_area_map.py --check

      - name: The external-data guards can still fail
        # extdata.py asserts the columns and categorical VALUES of the datasets the
        # autoimprove pipeline reads. Its self-test uses synthetic frames, so unlike
        # the pipeline itself it runs anywhere. Here for the same reason
        # selftest_gates exists: a guard that is only hand-tested decays quietly.
        run: python3 pipelines/polity-autoimprove/extdata.py

      - name: The polygon feature index still matches its sources
        # SKIPs in CI, where data/geodata is gitignored: rebuilding from a partial
        # set of sources would delete the rows of every unfetched one. It verifies
        # locally, which is where the index is regenerated.
        run: python3 scripts/write_feature_index.py --check

      - name: Consumer manifest matches the database
        if: '!cancelled()'
        run: python3 scripts/write_manifest.py --check

      - name: Wiki index coverage table is current
        if: '!cancelled()'
        run: python3 scripts/update_wiki_index.py --check

      - name: territory_basis.csv still describes the current database
        if: '!cancelled()'
        run: python3 pipelines/polity-autoimprove/04_territory_basis.py --check

      - name: source_stated_areas.csv still matches the yearbooks
        if: '!cancelled()'
        run: python3 pipelines/polity-autoimprove/08_source_stated_areas.py --check

      - name: source_stated_area_basis.csv still matches the polygons and the sources
        if: '!cancelled()'
        run: python3 scripts/write_stated_area_basis.py --check

      - name: iso3_successor_map.csv still matches the chain graph
        if: '!cancelled()'
        run: python3 scripts/write_iso3_successor_map.py --check

      # Issue 14: a source can report, under a territory's own label, a quantity the
      # territory did not produce (IIA green coffee under `djibouti` is Ethiopian beans
      # in transit through the port). The judgement was recorded in prose, where no
      # aggregation can reach it; this step keeps the machine-readable publication of it
      # from going stale, because a non-production flow known to state and absent from
      # data/final is a double-count nobody can exclude.
      - name: source_flow_flags.csv still matches the recorded source conventions
        if: '!cancelled()'
        run: python3 scripts/write_source_flow_flags.py --check

      # Issue 24: the conventions registry is a PREMISE handed to every verifier that
      # touches the source (00_intake.py attaches matching entries to the evidence
      # bundle), so a dead pattern, a short row appended by a script that knows fewer
      # columns, or a claim resting on one agent propagates further than any single
      # verdict. Everything checked here comes from tracked files; the magnitude re-test
      # needs the gitignored layer-B panel and runs by hand
      # (pipelines/polity-autoimprove/11_retest_conventions.py), with this step
      # guaranteeing every entry is covered by one.
      - name: Ledger — every banked verdict names a polity that exists
        if: '!cancelled()'
        run: python3 scripts/validate_review_ledger.py

      - name: The source-conventions registry is well-formed, live and corroborated
        if: '!cancelled()'
        run: python3 scripts/validate_source_conventions.py

      # 335 raw IIA yearbook labels were collapsed onto 173 modern countries, and until the
      # mapping was tracked nothing here recorded which went where -- so `serbia` meaning
      # Yugoslavia and `viet nam` meaning Tonkin were both invisible. Layer B deduplicates, so a
      # whole and its parts sharing a target produce no duplicate row to find: one silently wins.
      # This refuses NEW `verified_equal` claims on such a label, since that verdict asserts the
      # source territory IS the polity's and a mixed label has no single territory.
      - name: Provenance — no equality claim rests on a label that mixes territories
        if: '!cancelled()'
        run: python3 scripts/validate_iia_label_provenance.py

      # Layer B assigns each (country, year, item, unit) cell to exactly ONE source — zero of its
      # 179,097 cells carry two — so a series drawing on several is SPLICED, and every splice is a
      # seam where a scale mismatch can enter unnoticed. 373 seams move the value by >30%; 30 by
      # >100x. Nine countries show tobacco jumping x101 at a mitchell->iia seam and back down at the
      # return seam. The panel is gitignored, so this reads the committed table 16_source_splices.py
      # writes.
      - name: Sources — a spliced series must not change scale at the seam
        if: '!cancelled()'
        run: python3 scripts/validate_source_splices.py

      # A series repeating one value for years breaks no magnitude bound, opens no year gap and
      # crosses no source seam, so nothing else looks for it -- yet the rows carry ZERO VARIANCE and
      # every trend reading of them says "unchanged" when nobody knew. Only runs the series itself
      # refutes are recorded: argentina soybeans resolves 2 ha then sits at exactly 1,000 for eleven
      # years, denmark potatoes reads 54,000 for a decade in a series carrying 54,100. 246 runs,
      # 1,619 rows. The panel is gitignored, so this reads the committed 17_constant_runs.py table.
      - name: Sources — a repeated value must not outlive the resolution that refutes it
        if: '!cancelled()'
        run: python3 scripts/validate_constant_runs.py

      # 05_magnitude_screen.py screens series MEDIANS against polity area, so a single bad year is
      # invisible to it: iia cameroon groundnuts runs 61,000 / 620,004,098 / 62,000 ha and its median
      # is 71,000, while Cameroon's whole land area is ~47.5M ha. No source seam either -- spike and
      # both neighbours are one source. 21 spikes >=20x BOTH neighbours, all pinned by identity.
      - name: Sources — no single year may read many times its own neighbours
        if: '!cancelled()'
        run: python3 scripts/validate_isolated_spikes.py

      # validate_composition_sums.py check C needs TWO polity codes to forbid a double count, so the
      # case where BOTH labels route to the SAME code has no pair to register. Issue 355 found four by
      # asking whether one label extends another, which matched 39 polities of which 4 were real.
      # Deriving them from shared (item, unit, year) cells instead finds 37 pairs, 13 with enough
      # cells to support a verdict, and none of issue 355's four among them.
      - name: Sources — two labels of one source may not collide on one polity's cells
        if: '!cancelled()'
        run: python3 scripts/validate_same_polity_overlaps.py

      # iia tobacco/hops production from 1934 runs at a median implied yield of 76 t/ha against 0.92
      # before, and 1933 is the last year a second yearbook volume offers an opinion (issue 414). The
      # per-row verdicts are gated rather than the era: 50 rows carry production on an area of exactly
      # 0, so their implied yield is infinite, and an `if area > 0` guard exonerates 14 of them.
      - name: Sources — post-1933 tobacco/hops verdicts must match their own numbers
        if: '!cancelled()'
        run: python3 scripts/validate_era_shift_verdicts.py

      # Where a source REVISES its own stated area by >=50%, does our periodisation have a boundary
      # there? 11 of 18 agree — Serbia -> Yugoslavia 87,776 -> 247,916, Romania's Transylvania gains,
      # Trianon — which corroborates the spans from data rather than from historical reading, and no
      # other check here does that. 7 have one polity spanning the revision. Rows whose cause is
      # already recorded in validate_stated_areas' BASELINE/SOURCE_NOTES are excluded, so a diagnosed
      # source defect leaves the table by being diagnosed and this stays a worklist.
      - name: Sources — stated-area revisions must agree with their own verdict and our spans
        if: '!cancelled()'
        run: python3 scripts/validate_area_revision_boundaries.py
      # A layer-B nutrient series that consistently publishes the SMALLEST of several raw materials
      # the source prints side by side. Issue 379 gates raw-product switching on OSCILLATION, which a
      # series that never switches cannot trigger — so 7 of these 8 are invisible to it. spain/p reads
      # 5,400 t of phosphate rock while the same page prints 999,607 t of superphosphate, 15/15 cells;
      # japan/p reaches 3138x. The count is NOT pinned: the defect is fixable here, and a correct
      # remedy empties the table and collapses its denominator too, so any floor would fail the fix.
      # Does a source's OWN ARITHMETIC say its nested labels partition a territory or duplicate it?
      # fao1952 prints rye area 1,666 + 1,209 + 3 = 2,878 for Germany's three subdivisions against
      # 2,878 for the Reich -- 28 of 28 cells exact. The tree is re-verified from the label text
      # because an earlier generator filed `guinea-bissau` as a part of `guinea` and every
      # arithmetic arm stayed green: the ratios were real, the relationship was invented.
      # The machine-readable half of issue 446: how coarse is each source's reporting grid, keyed on
      # (source, unit) because juan's `heads` is 89% on a 1000-grid while its `ha` is 49%. Cross-checked
      # against source_conventions.csv so the table and the registry that justifies it cannot drift.
      - name: Sources — the value-precision table must agree with the grid conventions
        if: '!cancelled()'
        run: python3 scripts/validate_value_precision.py
      - name: Sources — nested-label identities must hold, and the label tree must be real
        if: '!cancelled()'
        run: python3 scripts/validate_label_hierarchy_identity.py
      - name: Sources — recorded component under-selections must still pick a minor material
        if: '!cancelled()'
        run: python3 scripts/validate_component_underselection.py
      # A published 0 that the source's reporting GRID cannot distinguish from a small positive
      # value. A 1000-grid cannot express 400, so it rounds to 0 and the panel shows "none". The
      # criterion is min_nonzero == grid — the quantity must live at the grid's resolution floor,
      # since a series of 500,000-tonne harvests on the same grid has zeros that mean what they say.
      # 201 zeros in 24 series, 197 of them dated and consumer-facing; every instance is a minor
      # commodity in a small territory (iceland goats: 103 observations, vocabulary {0, 1000, 2000}).
      # A DIFFERENT population from #414's false zeros, which are an extraction artefact upstream.
      - name: Sources — recorded grid-ambiguous zeros must live at their grid's resolution floor
        if: '!cancelled()'
        run: python3 scripts/validate_grid_ambiguous_zeros.py
      # Two labels of one source, byte-identical across a CONTIGUOUS block of years and plainly
      # different outside it: one series was copied into the other for a stretch. 89 pairs show the
      # shape; 6 survive a 4-distinct-value floor, and every block is a war window. The floor is the
      # whole screen — without it `estonia`/`iceland` goats qualify.
      - name: Sources — recorded cross-label duplications must still clear their own conditions
        if: '!cancelled()'
        run: python3 scripts/validate_cross_label_duplication.py
      # The consumer collapses duplicate keys with mean(value) over (year, area, item..., unit) — no
      # label and no source in the key — so the step above, which groups by source and reports label
      # PAIRS, cannot see two whole classes: duplicates under a single label (`germany` supplies TEN
      # rows for population 1937) and duplicates spanning sources. Of 1,995 groups whose members
      # disagree, only 60 — 3.0% — are reachable by a per-source label-pair screen, and 1,577 are a
      # true duplicate key (the other 418 are distinct MEASURES sharing an item code, issue 13).
      - name: Sources — the value the consumer publishes must be a mean of the rows it collapses
        if: '!cancelled()'
        run: python3 scripts/validate_collapse_groups.py

      # open(path,"w") and pandas.to_csv(path) both truncate on open, so a failure part-way through
      # loses a tracked file. Issue 431 found the four sites that mattered by grepping for
      # open(x,"w") — a floor, not a census. Re-swept with an AST there are 48 write sites, not 16;
      # the regex was blind to ~40 to_csv calls, all of which happen to write regenerable outputs.
      - name: State — no tool may truncate a state file holding unregenerable adjudications
        if: '!cancelled()'
        run: python3 scripts/validate_atomic_state_writes.py

      # A derived column can be wrong while every column beside it is right: collapse_groups'
      # ratio disagreed with its own rounded inputs (#457), and cross_label_duplication's
      # smaller_label named the LARGER label in all six rows while the column next to it stayed
      # correct, because both came from the same swapped variables (#470). This checks the cheapest
      # instance of that comparison generically, so future tables are covered too.
      - name: State — every n_<thing> column must equal the list it counts
        if: '!cancelled()'
        run: python3 scripts/validate_derived_counts.py

      # The raw IIA extract names the yearbook VOLUME each row came from, and nothing here had used
      # it. It is the only comparison that can convict a specific extracted cell: the same publisher
      # printed both numbers for the same territory, commodity and year. 83 cells read 0 in one
      # volume and a real value in another — ALL 83 in iia_1938_39, whose production/area zero rate
      # is 6.30% against 0.04–0.82% everywhere else (issue 414).
      - name: Sources — one yearbook volume may not contradict another about a cell
        if: '!cancelled()'
        run: python3 scripts/validate_edition_conflicts.py

      # validate_isolated_spikes.py is one-directional and skips endpoints, and both choices left a
      # hole with a confirmed defect in it: iia nauru/p ends on 97 after 424,896 — a transposition
      # with Australia's 1933 phosphate. 117 collapses at >=20x, ZERO overlapping the spike table.
      - name: Sources — no year may read many times BELOW its own neighbours
        if: '!cancelled()'
        run: python3 scripts/validate_series_collapses.py

      # Every other repetition guard looks along the YEAR axis. None could see one value repeated
      # across ITEMS in a single label-year, which has a different cause: a cell broadcast over a row.
      # mitchell india 1947 reads exactly 3,000 for asses, buffalo, camels, cattle, goats, horses,
      # sheep AND swine, in a year its cattle reads 155,295,000 (1951). 5 blocks, all defects.
      - name: Sources — four items may not share one value in a label-year
        if: '!cancelled()'
        run: python3 scripts/validate_item_blocks.py

      # Issue 273's table: 234 nesting pairs, 20 where inclusion is arithmetically impossible and 13
      # of those contradict an already-BANKED verdict. It was read by no gate until 2026-08-19. The
      # `inclusion` verdict re-derives exactly from cells_outer_lt_inner / shared_cells using the
      # generator's own thresholds — verified on all 84 rows that carry shared cells.
      - name: Sources — the nesting-flag verdicts must follow from their own numbers
        if: '!cancelled()'
        run: python3 scripts/validate_assertion_nesting_flags.py

      # The triage queue decides WHAT GETS LOOKED AT, so a silent corruption produces work never done
      # rather than a wrong number. Five of six arms re-derive a column from other columns; the sixth
      # checks inclusion_impossible against assertion_nesting_flags.csv, the table it was copied from.
      - name: Sources — the assertion triage queue must describe its own rows
        if: '!cancelled()'
        run: python3 scripts/validate_assertion_triage.py
      # The largest tracked state table (402 KB, 2,718 rows) was read by NO gate until 2026-08-19.
      # Issue 432: the committed copy had drifted 115 rows AND two whole columns behind its
      # generator, and still carried six rows on two polity codes that no longer exist. No row-count
      # baseline here on purpose — CI has no layer-B panel, so freshness is unverifiable, and a count
      # pin would fail the moment someone legitimately regenerates.
      - name: Sources — the magnitude outlier table must describe its own rows
        if: '!cancelled()'
        run: python3 scripts/validate_magnitude_outliers.py

      # A label can be right for one commodity and wrong for another, and no label-level decision can
      # fix that: the alias key is (label, source, years) with no item dimension. 11 iia labels mix
      # raw labels across their item series -- australia's `p` is CHRISTMAS ISLAND phosphate,
      # french polynesia's is MAKATEA, syrian arab republic carries Lebanon in its COTTON only. The
      # gate's main job is signal C: it refuses an attribution that does not clear the distinctness
      # filter, because loosening that and regenerating would refill the table with chance collisions.
      - name: Sources — no iia label may mix territories across its item series unrecorded
        if: '!cancelled()'
        run: python3 scripts/validate_item_provenance.py

      # A series can have the right territory, a constant item name and one unchanging source, and
      # still be a patchwork of different commodities. australia's `sugar raw centrifugal` alternates
      # cane and BEET (x0.01 down, x873 back up, 12 of 33 cells at ~1/300 of the series); sweden's `p`
      # alternates superphosphate and basic slag, which is why `p` is not a P2O5 total. Recorded only
      # on OSCILLATION -- a product returning after another intervened -- because comparing product
      # medians confounds this with growth and inflated the count from 9 to 28.
      - name: Sources — an item series must not switch raw product back and forth
        if: '!cancelled()'
        run: python3 scripts/validate_item_product_switches.py

      # Three defects found by hand share one shape: an item carrying a raw product it is not named
      # for. `wheat` is spelt and meslin (the source has NO wheat production rows), `flax fibre and
      # tow` is majority LINSEED, and `p` is a patchwork of fertiliser materials. So every (item, raw
      # product) mapping now needs an explicit verdict, and building the registry immediately found a
      # fourth: `other sugar crops n e c` <- `citrus fruits: other`, 21 cells, two "other" buckets
      # joined. 17 pairs are `unresolved` on purpose rather than waved through.
      - name: Sources — every item/product mapping must be adjudicated
        if: '!cancelled()'
        run: python3 scripts/validate_item_equivalences.py

      # Assertion keys are `label|source|first-last`, so re-deriving the queue re-splits spans and
      # renames keys: 52 of 460 banked verdicts match nothing in the current queue, ALL of them span
      # drift. quarantine.csv is tracked and independently keyed so prior quarantine work is found and
      # cited; an ordinary `confirm` had no such carrier and was silently paid for twice (issue 308).
      # 23_verdict_carryover.py writes that carrier; 75 rows recover 50 orphans onto 69 queue keys,
      # 51 of which would otherwise be decided from scratch. It is EVIDENCE, not a re-bank.
      - name: Verification — a verdict orphaned by re-spanning must not vanish
        if: '!cancelled()'
        run: python3 scripts/validate_verdict_carryover.py

      # 1,130 (country, item, unit, source, indicator, year) groups hold several rows that NO column
      # distinguishes -- item_code, source_detail, period, polity_code and iso3c are identical -- because
      # fao1952's item labels are collapsed multi-commodity ranges (`horses mules asses`, item_code
      # `110_117`). In 239 of them the largest value equals the sum of the rest, i.e. a TOTAL sits beside
      # its own parts and summing returns exactly double (united states meat 1950: 10,015 = 4,884 +
      # 4,860 + 271). is_aggregate is False and correctly so -- the COUNTRY is not an aggregate; the
      # aggregation is on the ITEM axis, which that flag does not describe. Issue 367.
      - name: Sources — no item-axis total may sit beside its parts unrecorded
        if: '!cancelled()'
        run: python3 scripts/validate_item_axis_aggregates.py

      # 19_composition_overlaps.py writes state/composition_overlaps.csv from the matcher's ACTUAL
      # routings, not just the alias map: only 205 of 832 routings come from an alias, so a part
      # reached by iso/name matching was invisible to the composition gate's double-count arm. 13
      # real overlaps were hidden, worst AOI-1936-1941 <- ERI-1889-1952 at 66 shared cells. The
      # table also DERIVES separate_series vs sum_risk by counting cells present on both sides.
      - name: Composition overlaps table matches the registry
        if: '!cancelled()'
        run: python3 pipelines/polity-autoimprove/19_composition_overlaps.py --layer-b /nonexistent

      # site/ is PUBLISHED output -- pages.yml deploys it on every change -- and until this
      # step existed `site/` appeared in exactly one workflow: the one that publishes it.
      - name: site/ shows exactly the live polities that carry geometry
        if: '!cancelled()'
        run: python3 scripts/validate_site_outputs.py

      # Added after sixteen territories got polities and stayed listed as having none, so their
      # data still resolved to ROW-1850-2025. Nothing linked the two files; now something does.
      - name: areas listed as unmapped really have no polity to map them to
        if: '!cancelled()'
        run: python3 scripts/validate_registry_unmapped.py

      - name: Polygons — area agreement, claimed-but-absent, reviewed-means-documented
        if: '!cancelled()'
        run: python3 scripts/validate_polygons.py

      # The polygon we publish must be the polygon we read (issue 71). build_database.py
      # simplifies, densifies and repairs before writing, and simplification alone once
      # deleted 42% of the Maldives -- which made `polygon_area_km2` unfillable, because the
      # page could either state the truth and fail check A or state the rendering and
      # understate the country. The reference is polygon_feature_index.csv's `area_km2`,
      # measured from the raw source, so this needs no data/geodata and runs here.
      - name: Shipped polygons still measure what their sources measure
        if: '!cancelled()'
        run: python3 scripts/validate_simplification_loss.py

      - name: No new invalid geometry in the published GeoPackage
        if: '!cancelled()'
        run: python3 scripts/validate_polygon_validity.py

      - name: Polygons agree with the areas the sources state for themselves
        if: '!cancelled()'
        run: python3 scripts/validate_stated_areas.py

      - name: Wiki pages only name things that exist
        if: '!cancelled()'
        run: python3 scripts/validate_references.py

      - name: No polity can shadow a sibling via family ordering
        if: '!cancelled()'
        run: python3 scripts/audit_family_shadowing.py

      - name: Every alias can actually route to a live polity
        if: '!cancelled()'
        run: python3 scripts/validate_aliases.py

      - name: Every matcher crosswalk routes to a live polity, and refuses to write when it cannot
        if: '!cancelled()'
        run: python3 scripts/validate_matcher_orphan_guard.py

      - name: Duplicated constants still agree
        if: '!cancelled()'
        run: python3 scripts/validate_constants.py

      - name: No territory belongs to two reporting aggregates
        if: '!cancelled()'
        run: python3 scripts/validate_reporting_areas.py

      - name: No two periods of one family, or of two families sharing a territory, cover the same year
        if: '!cancelled()'
        run: python3 scripts/validate_period_overlaps.py

      - name: No FAOSTAT area-year has two live polity answers
        if: '!cancelled()'
        run: python3 scripts/validate_map_area_year.py

      - name: The FAOSTAT map stays inside the era it declares
        if: '!cancelled()'
        run: python3 scripts/validate_map_era_scope.py

      - name: No family leaves a year covered by nothing
        if: '!cancelled()'
        run: python3 scripts/validate_period_gaps.py

      - name: No alias claims a year its polity does not cover
        if: '!cancelled()'
        run: python3 scripts/validate_alias_year_coverage.py

      - name: Live polities carry real ISO 3166-1 codes
        if: '!cancelled()'
        run: python3 scripts/validate_iso_codes.py

      - name: No new pair shares an ISO code over the same years
        if: '!cancelled()'
        run: python3 scripts/validate_iso_collisions.py

      - name: Dissolved states with an ISO 3166-3 code follow one coding rule
        if: '!cancelled()'
        run: python3 scripts/validate_dissolved_iso_codes.py

      - name: No unranged alias points at an ended polity
        if: '!cancelled()'
        run: python3 scripts/validate_unranged_aliases.py

      - name: Succession links join territories that touch
        if: '!cancelled()'
        run: python3 scripts/validate_succession_geography.py

      - name: The succession graph is a coherent chronology
        if: '!cancelled()'
        run: python3 scripts/validate_chain_integrity.py

      - name: No new pair shares a Correlates of War code
        if: '!cancelled()'
        run: python3 scripts/validate_cow_codes.py

      - name: No two families share a name over the same years
        if: '!cancelled()'
        run: python3 scripts/validate_cross_family_names.py

      - name: No period is wildly out of scale with its own family
        if: '!cancelled()'
        run: python3 scripts/validate_family_areas.py

      - name: No area step coincides with a polygon-source change unaccounted for
        if: '!cancelled()'
        run: python3 scripts/validate_source_change_steps.py

      - name: Published label alias map matches the registry
        if: '!cancelled()'
        run: python3 scripts/write_label_alias_map.py --check

      - name: The two matchers agree with each other
        if: '!cancelled()'
        run: python3 scripts/crosscheck_matchers.py

      # Issue 17: the matchers' real inputs (the layer-B parquet, common_names.csv, a WHEP
      # checkout for the FAOSTAT pins) live outside the repository and are not
      # redistributable, so no CI run ever executed the matching RULES. This runs them on a
      # committed synthetic fixture -- invented polities, invented aliases -- and then runs
      # 00_intake.py itself over a committed 11-row input, so the pipeline entry point is
      # executed too. Measured: it catches a half-open-alias-bound regression that
      # crosscheck_matchers passes.
      - name: The matcher's rules and the intake path run on a committed fixture
        if: '!cancelled()'
        run: python3 scripts/validate_matcher_fixture.py

      - name: No label's route is decided by family order
        if: '!cancelled()'
        run: python3 scripts/validate_order_decided_families.py

      - name: Polygon bindings belong to the period their row covers
        # Reads the committed feature index and GeoPackage only, so unlike the
        # determinism gate this one does real work in CI from the start. Found eight
        # wrong bindings across five families, none visible to an area check.
        run: python3 scripts/validate_polygon_period_fit.py

      - name: Polygon bindings are decided by the data, not by shapefile row order
        # Reads data/final/polygon_feature_index.csv, so this runs for real in CI (issue
        # 103). It previously needed the gitignored shapefiles and verified nothing here.
        run: python3 scripts/validate_polygon_binding_determinism.py

      - name: Polygons — no swallowed neighbour, no discontinuous family
        if: '!cancelled()'
        run: python3 scripts/validate_spatial_containment.py

      - name: Polygons — measurable on the sphere, not just in the plane
        # Every other geometry gate reasons in the plane, so none could see that ten
        # polygons were unloadable by s2 -- two of them while GEOS-valid, carrying a
        # pinch 4e-10 m wide that GEOS reads as no intersection and s2, which rounds
        # lon/lat onto unit vectors, reads as a crossing. sf::st_area() and
        # sf::st_intersection() both ABORT on those, so the territory leaves a gridded
        # build rather than arriving wrong. FJI-1800-2025 is live today and FAOSTAT area
        # 66 routes to it across 203,519 observed rows: its polygon raised
        # "Loop 82 edge 4 crosses loop 332 edge 2" against a 0.5-degree grid where live
        # neighbour TON-1800-2025 returned 20 cells. Asks s2 itself, via spherely, since
        # a gate that only approximates it can pass while the consumer aborts.
        if: '!cancelled()'
        run: python3 scripts/validate_s2_polygons.py
      - name: Polygons — a planar straight border still renders as a straight border
        # The 49th-parallel US/Canada border shipped as ONE segment 27.6 degrees of
        # longitude wide, and under s2 -- which sf uses by default, and which any
        # geodesic area requires -- a segment is a GREAT CIRCLE bulging poleward
        # between two equal-latitude points. It therefore rendered as an arc reaching
        # latitude 49.83, 92 km into Canada, booking 12.33 Mha of Canadian prairie to
        # the United States. NOT ONE OTHER CHECK HERE COULD SEE IT: USA + CAN =
        # 1.0000 in every cell, no overlap, no gap, planar area identical to the bit.
        # A clean mutual displacement, and every gate above is either planar or
        # conservation-based -- conservation detects non-conservation, never
        # misattribution. Half the cause was ours: CShapes stores that border with
        # 124 vertices and build_database.py's own 0.01-degree Douglas-Peucker
        # deleted all 124, because DP measures deviation from the chord in PLANAR
        # degrees. eduaguilera/whep#529.
        if: '!cancelled()'
        run: python3 scripts/validate_spherical_edges.py
      - name: Polygons — no two coexisting polities on one polygon
        # Measured in the consumer, which is where it surfaced: WHEP's embedded copy
        # has TWELVE cross-family pairs coexisting on one polygon, and for 2015 451 of
        # 67,691 grid cells claim more territory than they contain, 12.72 Mha in excess,
        # worst ratio 2.0000x at cell (10.25, 1.75) — GNQ-1968-2025 and STP-1800-2025
        # both bound to CShapes feature 411. The defect was injected back into a copy of
        # this repository at the wiki, the CSV and the GeoPackage together, and all 27
        # gates then exited 0 without naming STP-1800-2025: the area check had no
        # recorded area to compare, the containment check needs three swallowed
        # neighbours and two identical polygons swallow one each, and the period-fit and
        # determinism checks confirm that 411@1900 resolves cleanly — it is simply the
        # wrong country. Nothing asked whether another live polity already held it.
        if: '!cancelled()'
        run: python3 scripts/validate_shared_polygons.py

      - name: Polygons — coexisting polities overlap only by a pinned amount
        # The half of issue 143 that is implementable. Sharing a polygon outright is
        # forbidden above; PARTIAL overlap is where the rest of the cell over-claim lives
        # — 188 coexisting pairs and 331,319 km2 in 2015, which is 544 of 68,549
        # half-degree cells claiming more than they contain, 30.73 Mha in excess. That
        # total is NOT a defect to be zeroed: 267,078 km2 of it is Western Sahara coded
        # from both sides, a territorial judgement PR 247 deliberately left open, and
        # 7,920 km2 is the decided gross-polygon convention. So the gate names and
        # classifies every pair overlapping >=10% of the smaller polity — measured, the
        # sliver tail tops out at 1.07% and every decided pair is 14.1% or more, so the
        # classes do not touch — and pins the remaining ~177 pairs, 5,160 km2 in 2015, as
        # a budget that cannot grow. Five sliver pairs above 2,000 km2 are pinned by SIZE,
        # so a border drifting further apart is reported even though the pair is known.
        if: '!cancelled()'
        run: python3 scripts/validate_coexisting_overlaps.py


      - name: Identity — a code's years match its own columns
        if: '!cancelled()'
        run: python3 scripts/validate_code_year_agreement.py

      - name: Identity — every component reads end_year the same way
        # `end_year` is EXCLUSIVE here and matchlib read it INCLUSIVELY, so at a
        # transition year an ENDED period competed for the year and, wherever a third
        # row overlapped the family, won on list order: 12 layer-B (label, source,
        # year) tuples carrying 190 rows resolved to a polity that had already ended,
        # every India transition among them. Nothing errored — both readings return a
        # live, plausibly-dated polity — and issue #77's "four territory-years fall in
        # no polity" turned out to be ONE, the other three being artefacts of
        # measuring with one convention against data governed by the other. The gate
        # compares one NAMED constant across the three components that resolve a year,
        # checks wiki/README.md states it (it did not state it at all), and asks the
        # matcher whether an ended period still wins its own boundary year.
        #
        # It also holds the OTHER field, which reads the other way on purpose: alias
        # `year_end` is INCLUSIVE, so a consistent pair is end_year == year_end + 1.
        # That reading was still unnamed, and matchlib.assign applied it to the
        # TARGET's exclusive end_year for every alias, including blanket ones that
        # claim no year at all — 219 of 903 rules could reach their target's end_year
        # and 19 did so without declaring it.
        if: '!cancelled()'
        run: python3 scripts/validate_year_semantics.py

      - name: Aliases — consecutive ranges in a chain do not touch
        if: '!cancelled()'
        run: python3 scripts/validate_alias_chain_overlaps.py

      - name: Names — one live polity per name and year, so a name can resolve
        if: '!cancelled()'
        run: python3 scripts/validate_live_name_ambiguity.py

      - name: Identity — the iso3_code vocabulary is stable, since consumers join on it
        if: '!cancelled()'
        run: python3 scripts/validate_local_iso_codes.py

      - name: Coverage — every polity that receives data carries a polygon
        if: '!cancelled()'
        run: python3 scripts/validate_data_without_geometry.py

      - name: Corrections — each land-use diagnosis matches its own arithmetic
        if: '!cancelled()'
        run: python3 scripts/validate_landuse_corrections.py

      - name: Corrections — each area x yield repair matches its own arithmetic
        if: '!cancelled()'
        run: python3 scripts/validate_yield_corrections.py

      # The double-count arm now reads pipelines/polity-autoimprove/state/composition_overlaps.csv
      # as well as the alias map: only 205 of 832 label->polity routings come from an alias, so a
      # part reached by iso/name matching used to be invisible here. 13 real overlaps were, worst
      # AOI-1936-1941 <- ERI-1889-1952 at 66 shared cells. That table also carries the shared-cell
      # counts that DERIVE separate_series vs sum_risk, which check C used to take on trust.
      # Refresh with 19_composition_overlaps.py --write, which needs the gitignored panel.
      - name: Relations — a whole's parts sum to it, sit inside it, and declare their data overlaps
        if: '!cancelled()'
        run: python3 scripts/validate_composition_sums.py
      - name: Corrections — each sub-national sum matches its own arithmetic
        if: '!cancelled()'
        run: python3 scripts/validate_subnational_sums.py
      - name: Containment — no irrigated-area breach of arable land is waved through as multiple cropping
        if: '!cancelled()'
        run: python3 scripts/validate_land_containment.py
      - name: Mirrors — every flagged trade flow really breaches both halves of the screen
        if: '!cancelled()'
        run: python3 scripts/validate_trade_mirror_gaps.py
      - name: Mirrors — and each direction verdict follows from the exporter's own supply
        if: '!cancelled()'
        run: python3 scripts/validate_trade_direction_tiebreak.py

      # Last, because it is the only step that answers "can the steps above
      # fail?". Twenty-one gates that all pass are indistinguishable, from a
      # green summary, from twenty-one gates that cannot fail.
      - name: Gates — prove they fail on an injected defect
        if: '!cancelled()'
        run: python3 scripts/selftest_gates.py
