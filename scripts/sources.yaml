# Polygon source registry.
#
# Each source has:
#   file        — path (relative to repo root) to the raw source file
#                 downloaded by scripts/sources/<slug>/fetch.{sh,py,R}
#   layer       — layer name (for multi-layer GPKGs). Omit for single-layer
#                 files or non-GPKG formats.
#   id_column   — the column in the source that uniquely identifies features.
#                 Wiki frontmatter's `polygon_feature_id` matches against this.
#   id_type     — int | str. How to cast the wiki value before comparison.
#   temporal    — present for sources with multiple time-steps per id.
#     start_column, end_column — integer year columns (or full dates).
#     match_year — how to use wiki's `polygon_feature_year`:
#                  "within" → start <= year <= end
#                  "exact_start" → start == year
#
# Raw source files are all gitignored. Fetch them with the corresponding
# scripts/sources/<slug>/fetch.* before running scripts/build_database.py.

sources:
  cshapes-2.0:
    # CShapes 2.0 uses Gleditsch-Ward codes only (the COW coding was dropped
    # in v2.0). For most countries G-W == COW; when they differ, the wiki's
    # polygon_feature_id must use the G-W code.
    url: https://icr.ethz.ch/data/cshapes/CShapes-2.0.zip
    file: data/geodata/cshapes-2.0/CShapes-2.0.shp
    id_column: gwcode
    id_type: int
    temporal:
      start_column: gwsyear
      end_column: gweyear
      match_year: within

  cshapes-europe:
    url: https://icr.ethz.ch/data/cshapes/CShapes-Europe.geojson
    file: data/geodata/cshapes-europe/CShapes-Europe.geojson
    id_column: Id
    id_type: int
    temporal:
      start_column: From
      end_column: To
      match_year: within

  # GADM 4.1 split by admin level. Fetch script builds both per-level
  # combined GeoPackages by dowloading per-country files (cheaper than
  # the 1.4 GB world file) and selecting only the countries cited in
  # the wiki.
  gadm-4.1-adm0:
    url: https://gadm.org/
    file: data/geodata/gadm-4.1/gadm41_adm0.gpkg
    layer: polygons
    id_column: GID_0          # ISO3 country code
    id_type: str

  gadm-4.1-adm1:
    url: https://gadm.org/
    file: data/geodata/gadm-4.1/gadm41_adm1.gpkg
    layer: polygons
    id_column: GID_1          # e.g. "ESP.6_1" (Canarias)
    id_type: str

  gadm-3.6:
    # GADM 3.6 was used by the old R pipeline for ~216 subnational
    # entries that don't yet have wiki pages. Not needed until those
    # pages exist — keep this entry as a placeholder.
    url: https://biogeo.ucdavis.edu/data/gadm3.6/gadm36_levels_gpkg.zip
    file: data/geodata/gadm-3.6/gadm36_levels.gpkg
    layer: level1
    id_column: GID_1
    id_type: str

  paine-2024:
    url: https://dataverse.harvard.edu/api/access/datafile/:persistentId?persistentId=doi:10.7910/DVN/9QJVJ1/Y5QZG6
    file: data/geodata/paine-2024/PCS.shp
    id_column: PCS
    id_type: str

  cliopatria:
    # Seshat Global History Databank polities. Fetched from the main GitHub
    # repo (single 198 MB GeoJSON containing ~15k polity time-steps from
    # 3400 BCE to 2024 CE).
    url: https://github.com/Seshat-Global-History-Databank/cliopatria/raw/main/cliopatria.geojson.zip
    file: data/geodata/cliopatria/cliopatria_polities_only.geojson
    id_column: Name
    id_type: str
    temporal:
      start_column: FromYear
      end_column: ToYear
      match_year: within

  chgis-v6:
    url: https://dataverse.harvard.edu/api/access/datafile/:persistentId?persistentId=doi:10.7910/DVN/FYWHEE
    file: data/geodata/chgis-v6/v6_1820_pref_pgn_utf.shp
    id_column: NAME_PY
    id_type: str
    temporal:
      start_column: BEG_YR
      end_column: END_YR
      match_year: within

  usaboundaries-newberry:
    # Fetched via the R package USAboundaries. The fetch script writes a
    # GPKG snapshot keyed by (state_abbr, start_date).
    url: https://github.com/ropensci/USAboundaries  # R package
    file: data/geodata/usaboundaries-newberry/states.gpkg
    id_column: state_abbr
    id_type: str
    temporal:
      start_column: start_year
      end_column: end_year
      match_year: within

  mapspain-ign:
    # Fetched via the R package mapSpain.
    url: https://github.com/rOpenSpain/mapSpain  # R package
    file: data/geodata/mapspain-ign/provinces.gpkg
    id_column: cpro          # 2-digit province code
    id_type: str

  geobr-ibge:
    # Fetched via the R package geobr.
    url: https://github.com/ipeaGIT/geobr  # R package
    file: data/geodata/geobr-ibge/states.gpkg
    id_column: abbrev_state  # state abbreviation (e.g., "SP")
    id_type: str
    temporal:
      start_column: year
      end_column: year
      match_year: exact_start

  histogis-1860-habsburg:
    # Derived source: scripts/sources/histogis-1860-habsburg/build.py
    # dissolves the raw HistoGIS 1860 crownlands shapefile (fetched by
    # fetch.sh in the same directory) into Cisleithania and Transleithania
    # polygons keyed by polity_code.
    url: https://shared.acdh.oeaw.ac.at/histogis/austrian_empire_adm2_crownlands_1860.zip
    file: data/geodata/histogis-1860-habsburg/habsburg_cisleithania_transleithania.gpkg
    layer: habsburg_halves
    id_column: polity_code
    id_type: str

  constructed:
    # Manual polygons (Antarctic sector claims, Uqair Protocol, point buffers).
    # Maintained as a single hand-edited GeoJSON file in this repo.
    file: data/geodata/constructed/constructed.gpkg
    id_column: polity_code
    id_type: str

  reporting-areas:
    # Derived WHEP reporting-area aggregate polygons, keyed by polity_code.
    # Built by scripts/sources/reporting-areas/build.py from GADM 4.1
    # component polygons.
    file: data/geodata/reporting-areas/reporting_areas.gpkg
    layer: reporting_areas
    id_column: polity_code
    id_type: str
